# [C] charter:7617-7622. `ratchet` is the charter's own key; see the header note on it. V01-10
# (00-vision.md:711) states the same row as "<= 660 B +/- 10% on the 5,000-page generated PDF
# fixture, nightly ratchet". P2 exit is the earliest this can be measured against a real store
# (17-risks.md:290), and what closes at P2 is bytes-per-block only -- blocks-per-page needs the
# ten real 200-page documents of 03-document-model.md:3086 and is P3.
[[budget]]
id = "store.bytes_per_block"
value = 660
tol_pct = 10
gate = "nightly"
ratchet = true

# [C] charter:7599-7605, plus `process` per ADR-11 D5 / charter section 9.2 E88, stated as "Both
# shipped `rss.` rows declare `process = "worker"`" at 12-performance.md:227.
[[budget]]
id = "rss.gen5000p_peak_bytes"
value = 1_610_612_736
tol_pct = 10
gate = "nightly"
process = "worker"
note = """THE FORK-TRIGGER GATE. anydoc marshals eagerly into Python objects and py.detach does
not cover the marshal. A breach fires vendor/anydoc/FORK-TRIGGER.md."""

# [C] charter:7606-7610, plus `process` -- see the row above. The 4 GiB figure is a worker peak,
# and ADR-11 D5 is the whole reason the key exists: a reader who takes it for a whole-host figure
# sets sixteen workers against it and gets an OOM kill at hour six.
[[budget]]
id = "rss.merged4mcell_peak_bytes"
value = 4_294_967_296
tol_pct = 10
gate = "nightly"
process = "worker"

