# eval/perf.toml -- THE GATED SUBSET. The rows CI fails on, with a value, a tolerance and a
# gate class.
#
# Specified in 12-performance.md section 2.4 ("### 2.4 The gated subset -- `eval/perf.toml`",
# 12-performance.md:207), which declares itself the sole home of the `[[budget]]` row schema
# (12-performance.md:214-225). Read by tools/gate_budgets.py under Q-G15 (13-quality.md:1999,
# 13-quality.md:351-375). THIS FILE IS A REGISTER: every row below is TRANSCRIBED from a plan
# site named in the comment above it. A row the plan does not state does not belong here,
# however well motivated, and a value is never adjusted in transcription.
#
# WHAT A ROW IS NOT. A value here is a BUDGET -- an absolute floor owned by the product, whose
# breach means we shipped something worse than a published promise (charter:7633-7638). It is not
# a measurement. Nothing in this file has been measured on this checkout; at P2 the instrument
# that measures these rows (`ow eval perf`, W10.6) does not exist, and 12-performance.md:1966
# fixes the only machine a Budget may live on as `ow-bench-1`, which is not the machine this
# repository is being written on.
#
# ---------------------------------------------------------------------------------------------
# THE ROW SCHEMA, 12-performance.md:215-225. An unknown key is a hard error at load; `tol_pct`
# and `tol_abs` are mutually exclusive and exactly one is required.
#
#   id       str, [a-z0-9_.]{1,64}, unique across the file            required
#   value    int | float, in the unit the id's suffix names           required
#   tol_pct  int 0-100                          exactly one of the two is required
#   tol_abs  int | float, same unit as value    exactly one of the two is required
#   gate     str in {pr, nightly}                                     required
#   process  str in {supervisor, worker, driver_subproc, service}     iff the id starts `rss.`,
#            REJECTED on any other row
#   note     str                                                      optional
#
# ---------------------------------------------------------------------------------------------
# THREE PROVENANCES, and every row says which it is.
#
#   [C]  charter:7573-7630 -- ten rows, as TOML, verbatim. The `#`-comments on those rows are the
#        charter's own trailing comments, carried across.
#   [P]  12-performance.md:190-198 -- two rows the performance document ADDS under a heading that
#        says so in as many words ("**Extends the charter (new decision).**"), and which section
#        2.4's own table then renders as shipped rows at 12-performance.md:238-239.
#   [Q]  13-quality.md:1916-1941 -- three rows the quality document adds under "### 13.5 Five new
#        files, three new perf rows, two new gate rows" (13-quality.md:1903), each printed there
#        as a complete `[[budget]]` block with its own `note`.
#
# FIFTEEN ROWS, not twelve. Section 2.4's table renders twelve; the charter's TOML holds ten;
# 13-quality section 13.5 adds three more that section 2.4's table does not render. All fifteen
# are stated by the plan as `[[budget]]` rows of THIS file, so all fifteen are transcribed. A
# register does not get to pick which of its sources is right, so the disagreement in the count
# is reported as a finding and not resolved here.
#
# ROW ORDER is section 2.4's table order (12-performance.md:236-247) for the twelve it renders,
# then 13-quality section 13.5's three in the order that section prints them. Order carries no
# meaning -- `id` is the identity -- and the rendering's order is used so that a reader can diff
# the two by eye.
#
# ---------------------------------------------------------------------------------------------
# TWO KEYS THAT ARE NOT IN THE CHARTER TOML, both deliberate and both cited on their row:
#
#   `process` on the two `rss.` rows. Added by ADR-11 D5 and recorded as charter section 9.2
#   erratum E88; 12-performance.md:227-228 states the value in as many words -- "Both shipped
#   `rss.` rows declare `process = "worker"`". The charter TOML predates the key.
#
#   `ratchet = true` on `store.bytes_per_block`. The charter TOML carries it (charter:7622) and
#   section 2.4's table carries it in the tolerance cell ("+/-10%, **ratchet**",
#   12-performance.md:244), but the section 2.4 key table -- which declares itself the schema's
#   sole home and makes an unknown key a hard error -- does not list it. It is transcribed,
#   because dropping a key that two sites state would lose the only machine-readable form of "it
#   may fall and never rise"; tools/gate_budgets.py therefore knows the key, and the
#   contradiction between the key table and the two sites that use it is reported as a finding
#   rather than smoothed away.
#
# WHAT IS NOT HERE. 12-performance.md:1966 says "Every `eval/perf.toml` row and every
# `[cost.measured]` block names one [reference machine]", but the section 2.4 key table has no
# key for it and an unknown key is a hard error, so no row can. `[pacer] runner` below names
# `ow-bench-1` once, for the file; that is the only reading under which both sentences stand.
# Also a finding.

# ---------------------------------------------------------------------------------------------
# [pacer] -- charter:7567-7571, verbatim. Time is compared as a RATIO against this work, so a
# runner that is 12% slow today moves every timing row by 12% and the ratio does not move at all.
# ---------------------------------------------------------------------------------------------
[pacer]
work = "blake2b(64MiB) + a 2M int loop + 200k sqlite insert+select"
instability_pct = 15               # |before-after|/mean > 15% => UNSTABLE (not pass, not fail)
rule = "fail on 3 consecutive nightly runs above tolerance, comparing 7-run rolling medians"
runner = "ow-bench-1"              # ONE PINNED MACHINE. A runner change is a baseline reset.

