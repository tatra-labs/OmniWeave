# eval/gates.toml — the METRIC gate register.
#
# Two registers in this repository are called `gates.toml` and 11-repo-layout.md:394 makes the
# distinction load-bearing:
#
#   > `eval/gates.toml` holds the **metric** gates — `span_exact_rate`, `structure_f1`,
#   > `hallucination_rate` and the rest, each with an owner, a review date, a budget and a guard —
#   > and is owned by [quality](13-quality.md); `tools/gates.toml` holds the **G-series** — the
#   > twenty-nine CI gates of §6.4 — and is owned here. **Neither file may name a row the other
#   > owns.**
#
# Read by `ow eval run` (D868-D870) for every suite it measures, and by `ow eval release-check` for
# every `hard` row; by `tools/ow_eval.py`, and by `tools/ow_damage.py` for `degradation_detection`.
#
# WHY EVERY ROW CARRIES AN OWNER AND A `review_by`. 13-quality.md:1082: "every gate row carries an
# owner and a `review_by`, and a row past its date fails (`Q-G17`). There is no `--warn-only`
# anywhere: a downgrade is a `class` change in that file, a reviewed diff with an owner."
#
# THE COLUMNS are 13-quality.md section 8.3's table, one key per column:
#
#   metric      the name `ow eval golden --check <name>` takes
#   suite       which harness produces it
#   slice       the slice expression it is macro-averaged over
#   kind        `hard` | `floor` | `ceiling` — what `budget` means
#   budget      the number. For `hard`, equality; for `floor`, `>=`; for `ceiling`, `<=`
#   guard       the regression guard band, absent on a `hard` row because there is no band
#               below 1.000 to be inside
#   truth_kind  where ground truth comes from. `self_verifying` needs none, which is the
#               property that makes a row cheap
#   class       `blocking` | `informational`. A downgrade is a reviewed diff (12:1661)
#   computed    the definition, verbatim from the plan. "A floor with no definition is not a
#               gate" (13:1087)
#
# ONLY ONE ROW IS IMPLEMENTED AT P3, and the rest of section 8.3's table is deliberately absent
# rather than present-and-unenforced: a register row naming a metric nothing computes is a claim
# that something is being measured. They land with the harness that measures them —
# `structure_f1`, `order_acc` and `table_rel_acc` need the Tier A corpus and T4's assertions;
# `hallucination_rate` needs an extraction harness; `citability_violations` and
# `degradation_detection` need L4 and `Verdict`, which are P5's and P6's. `false_confident_zero`
# landed with the absence corpus's removal half (D933).

[[gate]]
metric = "span_exact_rate"
suite = "parse"
slice = "*"
kind = "hard"
budget = 1.000
truth_kind = "self_verifying"
class = "blocking"
owner = "quality"
reviewed_at = "2026-09-11"
review_by = "2026-12-10"
computed = """
over Blocks with `quote == VERBATIM`, the fraction whose `span` assertion re-verifies on the \
branch its `os_kind` selects. **Denominator is blocks that claim verbatimness**, so a slice with \
none passes vacuously — which is every office slice at release 1. \
(13-quality.md:1092, verbatim.)\
"""
sample_n = 1000
# 01-principles.md:328, 07-store-and-retrieval.md:2563 and 13-quality.md:1990 all say "a
# deterministic sample of n = 1000 blocks". Below that the sample is the population, which is
# every slice this repository has today. The sampler is blake2b and never `random`:
# pyproject.toml bans the module with the reason — "Sampling is blake2b. Determinism is a gate,
# not a habit."
guard_absent_because = """
A `hard` row has no guard band. 13-quality.md:36 states the failure mode a band here would be: \
"a byte-exactness claim degrades into an accuracy percentage and nobody notices it fell". 1.000 \
or the gate is red.\
"""
vacuous_is_not_pass = """
The denominator is a claim count, so a driver that claims nothing reports `vacuous` and not \
1.0000. `parse.office.anydoc` is exactly that case at release 1 — anydoc's eight `Block` variants \
carry no source address, so it declares `origin_span = "none"` honestly and emits \
`quote = "normalized"` on every block. 13-quality.md:661 says the gate "holds **vacuously** on \
that slice" and 17-risks.md R-T16 registers it as a risk rather than a defect. `ow eval golden` \
prints the denominator beside the rate and prints `verbatim_denominator_frac`, which is R-T16's \
own named indicator: its trigger is that share below 0.5 WHILE the rate reports 1.000, and the \
two read together are the finding.\
"""

# Q-G7's paired-damage half (13-quality.md section 8.6), the second row implemented. Its harness is
# `tools/ow_damage.py` (ledger D640) and its population is `omniweave_conform.damage.TABLE`: one
# Injector per `ABSENCE_BLOCKING_DIAGS` code, thirteen, of which the report names how many are
# built. A new Injector lands behind its own passing pair or not at all (13:1314).

[[gate]]
metric = "degradation_detection"
suite = "absence"
slice = "*"
kind = "hard"
budget = 1.000
truth_kind = "rendered"
class = "blocking"
owner = "quality"
reviewed_at = "2026-09-29"
review_by = "2026-12-28"
computed = """
over every `(Injector, fixture)` pair in §8.6, the fraction where all three clauses hold: `Verdict.state == degraded`, the expected gate appears in `Verdict.gates` in precedence order, and the emitted `DegradeCause.fix` command, executed, produces an undamaged run. (13-quality.md:1093, verbatim.)"""
guard_absent_because = """
A `hard` row has no guard band. 13-quality.md:1314: "A gate at 1.000 admits no partial coverage, so 'add the Injector now and make it pass next release' is not a state the gate can express.""""

# The absence corpus's removal half (13-quality.md section 8.6, Construction 1; ledger D933). Its
# harness is `omniweave_conform.removal`, run by `ow eval run --suite absence` beside the paired-
# damage half. A ceiling, not hard, so `min_slice_n` applies: below 30 answerable questions a slice
# is `unknown`, and `ow eval release-check` refuses it.

[[gate]]
metric = "false_confident_zero"
suite = "absence"
slice = "*"
kind = "ceiling"
budget = 0.01
truth_kind = "human"
class = "blocking"
owner = "quality"
reviewed_at = "2026-10-22"
review_by = "2027-01-20"
computed = """
over the absence corpus's **answerable** questions only (the counterfactual half of the removal \
construction), the fraction answered with `state == absent`. (13-quality.md:1095, verbatim.)\
"""
guard_absent_because = """
13-quality.md:1095 gives this row no guard band ("—"): its budget is the whole of the claim.\
"""

[[gate]]
metric = "citability_violations"
suite = "retrieve"
slice = "*"
kind = "hard"
budget = 0
truth_kind = "self_verifying"
class = "blocking"
owner = "quality"
reviewed_at = "2026-10-17"
review_by = "2027-01-15"
computed = """
a **count**, not a rate: rendered Answers containing a `cite` that does not resolve, plus \
artefacts containing a restricted item with no policy (OUT11). (13-quality.md:1094, verbatim.)\
"""
guard_absent_because = """
A `hard` row has no guard band. A cite that does not resolve is a citation the reader cannot \
follow, and 13-quality.md:51 sets this row's ceiling at 0: one such Answer is the gate red.\
"""

[[gate]]
metric = "citation_soundness"
suite = "retrieve"
slice = "*"
kind = "floor"
budget = 0.995
guard = 0.002
truth_kind = "self_verifying"
class = "blocking"
owner = "quality"
reviewed_at = "2026-10-17"
review_by = "2027-01-15"
computed = """
over every `cite` emitted in a scored run, the fraction resolving to a Block, a page and either \
a `Quad` or a `Locus.reason`, **and** whose `byte_exact` bit, where set, re-grounds under \
`normalize_k`. (13-quality.md:1101, verbatim.)\
"""

# R2 address survival as a hard row: a user ruling of 2026-10-19 (D902). 13-quality.md:1564 gives
# R2 an evaluation obligation and the `roundtrip` assertion type but no metric, so a failed element
# was a failed verdict and refused nothing (D871's ruling 16). The ruling makes survival a gate.
[[gate]]
metric = "address_survival"
suite = "roundtrip"
slice = "*"
kind = "hard"
budget = 1.000
truth_kind = "self_verifying"
class = "blocking"
owner = "quality"
reviewed_at = "2026-10-21"
review_by = "2027-01-19"
computed = """
over every IL element of each register `[[target]]`'s golden that carries `data-ow-el`, the \
fraction for which law R2 holds after compile then `read_back`: exactly one Block carries \
`x["x.ow.el"] == e.el`, with the kind `kind_map` gives the element's construct, NFC-equal text \
and the element's cites (13-quality.md:1564 and :1011). One value per target, its slice the \
target's name.\
"""
guard_absent_because = """
A `hard` row has no guard band. An address that does not survive the round trip is a citation \
that points at nothing once the artefact is read back, and there is no acceptable fraction of \
those.\
"""

# The portability suite, defined by a user ruling of 2026-10-19 (D903): the same inputs give
# identical results across the OS/Python cells. 13-quality.md:238 named the suite and nothing said
# what it measures, so it reported `unknown` (D872). One machine is one cell, so a run holds this
# cell to committed frozen values; `omniweave_conform.portability` states the two halves.
[[gate]]
metric = "cell_identity"
suite = "portability"
slice = "*"
kind = "hard"
budget = 1.000
truth_kind = "self_verifying"
class = "blocking"
owner = "quality"
reviewed_at = "2026-10-21"
review_by = "2027-01-19"
computed = """
over this cell's results for the committed inputs, the fraction identical to the committed \
frozen value: each Tier-A `.shape` Reduction against `fixtures/goldens/` (Q-G4's frozen kind, \
13-quality.md:671), and each register target's compiled parts, by sha256, against \
`eval/portability.toml`. The denominator is the union of frozen and produced names, so a missing \
or extra one is a difference. One value for the shapes, slice `shape`, and one per target, its \
slice the target's name.\
"""
guard_absent_because = """
A `hard` row has no guard band. 13-quality.md:2056: "`portability`/`perf` failing means the \
runner changed rather than the model", and a runner that changes one shape or one part has \
changed what every later number on it means.\
"""

# ---------------------------------------------------------------------------
# THE THREE ACCURACY FLOORS (ledger D983). 13-quality.md section 8.3's rows, verbatim.
# ---------------------------------------------------------------------------
#
# These are the rows V10-3 names, and the header's rule is why they arrive now and not sooner: a
# register row naming a metric nothing computes is a claim that something is being measured.
# `order_acc` and `table_rel_acc` have been computed by `omniweave_conform.rollup` since D912 and
# `structure_f1` by `omniweave_conform.structure` since D982, so all three now name a harness.
#
# WHAT A ROW BINDS TO. `ow eval release-check` matches a row to a measurement with
# `fnmatchcase(metric_row.slice_key, gate.slice)`, and a metric row's `slice_key` is the corpus's
# own declaration -- `[fixture.tests] slices` in a Tier A sidecar (13:1150). Until D983 no shipped
# sidecar declared one, so every verdict landed on `*` and these globs would have matched nothing:
# the rows would have been law over an empty set. The ten labelled office fixtures now declare
# `office/<ext>` (with `has_merges=1` first on the three that have a merged cell) and the four
# labelled PDFs `pdf/born_digital/gen`.
#
# AND SINCE D1002 each of the fourteen declares its family's COARSE slice beside that key:
# `office/labelled` on the ten, `pdf/born_digital/labelled` on the four. Every row below
# macro-averages at `min_slice_n = 30` and no single extension will hold thirty documents, so the
# per-extension keys report `unknown` for ever; one slice per family is the set that can reach
# thirty, under a user ruling of 2026-10-28. Both coarse keys match the globs already written
# here -- `fnmatchcase("office/labelled", "office/*")` -- so no row changes. The per-extension
# rows stay visible beside them saying `unknown, under min_slice_n`, which is the honest report
# rather than a hidden one, and Q-G1 ruling 14 holds the coarse key to the labels in both
# directions: a labelled fixture without it fails, and so does it on a fixture with no labels.
#
# WHAT THEY READ TODAY. Nothing is verified, so every rate is `unknown` and `release-check`
# refuses it by that alone -- these rows do not make a release pass or fail yet. What they do is
# stop Q-G27's ungated-metric clock (a `[[gate]]` row naming the metric stops it, whatever its
# standing), put the three floors under Q-G17's rot check with an owner and a date, and bind the
# budget for the run after the reviewer signs. The numbers are 13-quality.md's, not a measurement
# anyone took here: 0.90/0.85 for `structure_f1` (:1097-1098), 0.75 for `order_acc` (:1099, which
# :1110-1114 derives from marker's own 75% char-stream reading-order annotation), 0.70 for
# `table_rel_acc` (:1100).
#
# `structure_f1`'s SECOND row is deliberately absent. :1098 gives `pdf/born_digital/*` a 0.85
# floor, and `parse.pdf.pdfium` declares `[capability.parse] sections = "none"` with
# `tables = "none"` (02:266, F4 -- no licence-clean detector), so it emits no heading, table or
# cell to score: `omniweave_conform.structure.inapplicable()` reports the card's clause and the
# run writes no row. A floor over a declared capability nobody implements would be a gate that
# fails for a reason the code already discloses. It lands with a driver that declares structure.

[[gate]]
metric = "structure_f1"
suite = "parse"
slice = "office/*"
kind = "floor"
budget = 0.90
guard = 0.010
truth_kind = "rendered"
class = "blocking"
owner = "quality"
reviewed_at = "2026-10-26"
review_by = "2027-01-24"
computed = """
F1 over `(kind, layer, parent_kind)` triples: predicted Blocks matched to reference Blocks by \
`normalize_eval(text)` within the assertion's `max_diffs`, precision and recall over the matched \
set, macro over documents then over slices. (13-quality.md:1097, verbatim.)\
"""

[[gate]]
metric = "order_acc"
suite = "parse"
slice = "pdf/born_digital/*"
kind = "floor"
budget = 0.75
guard = 0.015
truth_kind = "rendered"
class = "blocking"
owner = "quality"
reviewed_at = "2026-10-26"
review_by = "2027-01-24"
computed = """
the fraction of `order` assertions that pass. (13-quality.md:1099, verbatim.)\
"""

[[gate]]
metric = "table_rel_acc"
suite = "parse"
slice = "*/has_merges=1"
kind = "floor"
budget = 0.70
guard = 0.020
truth_kind = "human"
class = "blocking"
owner = "quality"
reviewed_at = "2026-10-26"
review_by = "2027-01-24"
computed = """
the fraction of `table` and `cell_rel` assertions that pass. A direct verdict rollup, which is \
why `TableTest`'s relational shape was worth adopting. (13-quality.md:1100, verbatim.)\
"""

# ---------------------------------------------------------------------------
# The subjects `span_exact_rate` is measured over.
# ---------------------------------------------------------------------------
#
# A row per driver rather than a corpus path, because this metric needs no corpus: it needs a
# driver, its own fixtures, and the bytes those fixtures are made of. `slice` is the name the
# report groups under and matches 13-quality.md section 8.3's slice vocabulary.

[[subject]]
driver = "parse.pdf.pdfium"
card = "packages/omniweave-pdf/src/omniweave_pdf/driver.toml"
fixtures = "packages/omniweave-pdf/fixtures"
slice = "pdf/born_digital"
why = """
Where the gate has teeth. The card declares `origin_span = "exact"` and the driver emits \
`quote = "verbatim"` by construction — a block IS its glyph run, so its text is exactly \
`document_text[a : a+len]` — and it ships the `verify_origin()` hook INV-10's `glyphs` branch \
needs, because re-extraction requires pdfium and that is the driver's dependency rather than the \
kit's.\
"""

[[subject]]
driver = "parse.office.anydoc"
card = "packages/omniweave-office/src/omniweave_office/driver.toml"
fixtures = "packages/omniweave-office/fixtures"
slice = "office"
why = """
The vacuous slice, included ON PURPOSE. Leaving it out would make the report look like a gate \
that passes everywhere, when the truth is that it is unreachable on the format family most users \
will bring first. 17-risks.md R-T16: "The framework's two hardest fidelity gates are both green \
on the format family most users will bring first" — the disclosure is the mitigation, so the \
slice has to appear and has to say `vacuous`.\
"""

# ---------------------------------------------------------------------------
# The targets the roundtrip suite reads back (D871).
# ---------------------------------------------------------------------------
#
# A row per target: its compile card, the `read_back` card its `[compile.round_trip]` names, and
# its golden fixture. `ow eval run --suite roundtrip` compiles each golden, reads it back, and
# states law R2 (13-quality.md:1564) for every element carrying `data-ow-el`. `paths` are config
# values resolved against the checkout's root, because a driver resolves no path against the
# working directory.

[[target]]
target = "docx"
card = "packages/omniweave-target-docx/src/omniweave_target_docx/driver.toml"
read_back = "packages/omniweave-target-docx/src/omniweave_target_docx/read/driver.toml"
golden = "fixtures/out/golden/docx"

[[target]]
target = "pptx"
card = "packages/omniweave-target-pptx/src/omniweave_target_pptx/driver.toml"
read_back = "packages/omniweave-target-pptx/src/omniweave_target_pptx/back/driver.toml"
golden = "fixtures/out/golden/pptx"
paths = { font_dir = "fixtures/out/golden/pptx/fonts" }
why = """
The golden names the face `Probe Sans`, so its measurement band runs and its gate is not \
`unverified` (D805). The face is committed under the golden's `fonts/`, written by \
`packages/omniweave-target-pptx/tests/fontkit.py` with its defaults (D871).\
"""
