# ── W1.5, the registry (04-driver-system.md sections 4.5 and 12's DR3 row). A fresh numeric:
# the plan binds `DuplicateDriver` to `omniweave_core/registry.py` and names no code for it.
# `ID_COLLISION_UNQUALIFIED` is a different row — resolve()'s RejectCode, allocated at W3.1 —
# because a raise at registration and a rejection at resolution are two sites, not one.

[[code]]
numeric = "OW-D-013"
symbol  = "OW_DRIVER_DUPLICATE_ID"
meaning = "two distributions declare one driver id and no [drivers.resolve] row says which wins. Both distributions are named, because the operator cannot write the disambiguation without knowing both. A duplicate id NEVER wins silently (DR3): DataFlow's registry, keyed on a bare __name__, is first-wins and silent, so one plugin vanishes with no diagnostic"
fix     = "ow config set drivers.resolve.\"<id>\" <distribution>"
raised_by = "DriverHostError"
sites   = ["04-driver-system.md:1217", "04-driver-system.md:2675", "02-architecture.md:235"]
