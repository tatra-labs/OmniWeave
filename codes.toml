# ───────────────────────────────────────────────────────────────────────────────────────────
# The R area's first row. `route_decision_monotone` has raised this string since W2.2 and
# `0004_runtime.sql:364` carried a comment saying it had no row here yet; W5.4 closes that, because
# `tools/gate_trigger_parity.py` now asserts the string 49 times and `ow explain OW-R-030` has to
# answer for a code a gate prints.
#
# NO `raised_by`, for a reason unlike the lint six's. Those are reported and never raised; this one
# IS raised, by `RAISE(ABORT, ...)` inside a trigger, and reaches Python as a `sqlite3.
# IntegrityError` carrying the message. Naming `RouteError` here would claim a mapping that does not
# exist -- nothing in this repository converts that IntegrityError into an OwError subclass, and
# `raised_by` is read as "this class raises it", not as "this area would own it if something did".
# The area letter already records the ownership: `[area.R]` is `RouteError`.
# ───────────────────────────────────────────────────────────────────────────────────────────

