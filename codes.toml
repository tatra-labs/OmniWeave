# codes.toml — THE error-code register. Append-only against the last tag (G13).
#
# Every row carries a numeric OW-<AREA>-nnn (the human form), a stable OW_SCREAMING_SNAKE
# symbol (the stored and wire form, charter.md section 5 C9), a one-line meaning and the
# exact command that clears it. Specified in 02-architecture.md section 7.2 and
# 11-repo-layout.md sections 1.1 and 1.7. A row is NEVER renumbered and NEVER reused.
#
# SEEDED AT P1 with every definition site the plan already allocates — a numeric
# textually adjacent to its symbol, under the `codes-unique` adjacency rule of
# 18-api-sketch.md section 9 item 7. `sites` records where the plan binds the pair, so a
# later reader can check a row against its warrant rather than trusting this file.
#
# `fix` is DELIBERATELY ABSENT from every seeded row and is not an empty string: charter
# section 6.4 makes the fix the exact command that clears the error, OwError.__init__
# refuses an empty one, and inventing 85 of them here would be fabrication. Filling
# `meaning` and `fix` is W1.3 (16-roadmap.md section 4) — the half of that work item its
# estimation basis calls "the half that takes the time". `ow explain --check` is the
# gate that closes it.

# The ten area letters are exactly the ten OwError subclasses of 02-architecture.md
# section 7.2. ResourceLimit is cross-area and allocates no letter of its own.

[area.C]
error_class = "ConfigError"
default_symbol = "OW_CONFIG"
covers = "configuration, startup only"

[area.M]
error_class = "ModelError"
default_symbol = "OW_MODEL"
covers = "model and L2"

[area.D]
error_class = "DriverHostError"
default_symbol = "OW_DRIVER_HOST"
covers = "driver resolution and the driver host"

[area.R]
error_class = "RouteError"
default_symbol = "OW_ROUTE"
covers = "runtime, budget, cache, routing"

[area.S]
error_class = "StoreError"
default_symbol = "OW_STORE"
covers = "store"

[area.G]
error_class = "GraphError"
default_symbol = "OW_GRAPH"
covers = "graph"

[area.T]
error_class = "TargetError"
default_symbol = "OW_TARGET"
covers = "OUT targets and constructs"

[area.A]
error_class = "SurfaceError"
default_symbol = "OW_SURFACE"
covers = "answer, serve and the agent surfaces"

[area.P]
error_class = "PolicyRefusal"
default_symbol = "OW_POLICY"
covers = "policy and licence refusals"

[area.Q]
error_class = "QualityError"
default_symbol = "OW_QUALITY"
covers = "quality, cassette, eval"

