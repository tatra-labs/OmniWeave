# ── W3.1, resolve()'s RejectCode (04-driver-system.md sections 4.8 and 5.3). TWENTY-TWO fresh
# numerics, and the register's own W1.5 note above scheduled them here: "`ID_COLLISION_UNQUALIFIED`
# is a different row — resolve()'s RejectCode, allocated at W3.1".
#
# WHY THESE ROWS ARE TRANSCRIPTION AND THE NUMERIC IS ALLOCATION. 04-driver-system.md:1444 states
# the rule — "Every `RejectCode` member has a row in `codes.toml` under `OW-D-nnn` with the symbol
# `OW_DRIVER_<MEMBER>`, so the enum is a typed view over the one register rather than a second
# register" — and :1557-1558 repeats it ("each with an `OW-D-nnn` row"). So the row's EXISTENCE and
# its SYMBOL are both plan-stated; 01-principles.md:605 names "a new `RejectCode` member with no
# `OW-D-nnn` row" as a defect class by name, which makes the gap a defect and not a deferral. The
# three digits are the only free field, and they are this register's to allocate: of the seven
# `OW-D` rows above, only `OW-D-009` (18-api-sketch.md:2158), `OW-D-024` and `OW-D-051` have a
# numeric the plan binds — `OW-D-010`, `-011`, `-012` and `-013` were allocated here, from
# conditions the plan states, exactly as these are. 18-api-sketch.md:3197 sanctions the shape: "a
# new row in an existing class breaks no clause where a new *class letter* would".
#
# ALLOCATED FROM 052 UPWARD, above the highest existing `OW-D`, and deliberately NOT into the
# 014-023 / 025-050 gaps: the plan allocates numerics in adjacent clusters and moves rows to keep a
# cluster intact (18-api-sketch.md section 9 item 7's table), so the gaps are where a plan-stated
# numeric is most likely to land next. One contiguous block also matches the "signature block"
# practice of 18-api-sketch.md:3200.
#
# ORDER is section 5.3's own table order (04-driver-system.md:1563-1568): identity, fit, policy,
# environment, preflight, activate. `FORMAT_UNSUPPORTED` is absent because it already holds
# `OW-D-009`, and the three discovery members already hold `OW-D-010`/`-011`/`-012`.
#
# `fix` IS DELIBERATELY ABSENT, following `OW-D-009` and this file's header: a `fix` is the exact
# command that clears the error, and `ow drivers explain <code>` is the verb 04:1445-1447 assigns
# to resolve it. Inventing twenty-two commands here is the fabrication the header refuses. Filling
# them is W1.3's other half, closed by `ow explain --check`.
#
# `raised_by` IS DELIBERATELY ABSENT TOO, and that is a claim about control flow: resolve() RETURNS
# a `Rejection` and raises nothing (04:1574-1575 — `PORT_MISMATCH` is "raised as a rejection rather
# than an exception so a mis-wired policy rule produces a report instead of a traceback"). Writing
# `raised_by = "DriverHostError"` on a row no exception carries would be a false statement about
# the code, so the field is omitted rather than guessed. Area D's `[area.D]` table already names
