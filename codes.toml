[[code]]
numeric = "OW-P-011"
symbol  = "OW_POLICY_RULE_UNREACHABLE"
meaning = "an action rule subsumed by an earlier action rule at the same (rung, lane, phase)"
# Check 8, and the one W5.2 exists to ship. 05:1169: a subsumed rule "is a silently disabled guard,
# which is worse than a missing rule" -- worse because a missing rule is visible in a diff and a
# shadowed one reads as present. The compiler additionally drops it from the demand plan with a
# `Degradation(kind="policy_pruned")` naming the subsuming rule (15-observability.md:1077).
#
# MODIFIER RULES ARE EXEMPT ON BOTH SIDES. 05:1174: they "are meant to overlap", and 05:1023's
# evaluation order is why that is not merely a convenience -- a matched action does not stop a later
# modifier contributing, so a modifier inside another's box is a working policy.
#
# The report is SOUND AND INCOMPLETE BY DESIGN (F30, 17-risks.md:890): interval-box subsumption is
# "incomplete over open string domains -- exactly where policy authors collide", and the shipped
# behaviour is that "the linter reports only the complete cases AND SAYS SO", because a lint that
# overclaims is worse than none. `lint.Undecided` is the saying-so.
sites   = ["05-ingest-and-routing.md:1169", "05-ingest-and-routing.md:1781", "15-observability.md:1077", "17-risks.md:890"]

