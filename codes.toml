# ─────────────────────────────────────────────────────────────────────────────────────────────
# `ow route lint`'s six. 05-ingest-and-routing.md section 4.5 (:1767-1800) allocates fourteen
# numerics and NO symbols, so each of the six below is minted at its definition site the way
# OW-P-022 was, and the `meaning` is that table's own one-line check.
#
# NO `raised_by` ON ANY OF THE SIX, and the omission is the point: these are REPORTED by
# `omniweave/route/lint.py` as `Finding.code` and never raised. A lint that raised on its first
# finding would report one of fourteen checks and stop, which is the opposite of what section 4.5
# asks a policy-wide check for. The rows exist so `ow explain OW-P-011` answers -- a linter that
# prints a code the register cannot explain is the gap 02-architecture.md section 7.2 closes.
#
# The other eight of the fourteen are NOT here. OW-P-003 belongs to the retrieval surface,
# OW-P-005 and OW-P-013 already have rows above because the loader RAISES them, and OW-P-006,
# OW-P-012, OW-P-015, OW-P-021 and OW-P-024 each need a driver card or `[drivers] enabled` and
# have no definition site in this repository yet. `lint.NOT_RUN` carries that list as data.
# ─────────────────────────────────────────────────────────────────────────────────────────────

