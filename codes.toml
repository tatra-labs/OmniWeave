# ── W1.5, the driver card grammar (04-driver-system.md sections 2.1-2.8, 4.5, 5.3, 7.5). The
# three discovery-point refusals of section 5.3 step 1, plus the two numerics the plan already
# binds. `meaning` and `fix` are FILLED here rather than deferred to W1.3: these five are raised
# by code landing in this same change, so the command that clears each one is known now.

[[code]]
numeric = "OW-D-010"
symbol  = "OW_CARD_INVALID"
meaning = "a driver.toml the loader refuses: an unknown top-level table or key, a value outside a closed vocabulary, a section 4.5 cap breach naming the key and the cap, a [limits] value above HOST_MAX (DR20), a [config] keyword outside the closed JSON-Schema subset, an empty [deprecation] or [licence.weights], revision=\"main\", or a benchmark row with n < 30 or an incomplete measured_on"
fix     = "ow drivers check <path/to/driver.toml>"
raised_by = "DriverHostError"
sites   = ["04-driver-system.md:1523", "04-driver-system.md:1196", "04-driver-system.md:1562"]

[[code]]
numeric = "OW-D-011"
symbol  = "OW_CARD_ENTRYPOINT_MALFORMED"
meaning = "[driver] entrypoint is not <dotted.module>:<Attr> - it lacks exactly one ':' or carries a '/'. The entry-point VALUE is a colon-free dotted package and is a different name with a different grammar; activate() is the only site that resolves the colon form"
fix     = "ow drivers check <path/to/driver.toml>"
raised_by = "DriverHostError"
sites   = ["04-driver-system.md:1053", "04-driver-system.md:1524", "04-driver-system.md:1562"]

[[code]]
numeric = "OW-D-012"
symbol  = "OW_CARD_SCHEMA_TOO_NEW"
meaning = "card_schema is above max(CARDS_SUPPORTED): the card is well-formed in a grammar this build does not implement, so the fix is an upgrade and never an edit to the card"
fix     = "pip install --upgrade omniweave-core"
raised_by = "DriverHostError"
sites   = ["04-driver-system.md:1499", "04-driver-system.md:1522", "04-driver-system.md:1344"]

[[code]]
numeric = "OW-D-024"
symbol  = "OW_FORMAT_TOKEN_COLLISION"
meaning = "a media type mapping to two format tokens across enabled cards: two [capability.parse] format_tokens pairs give one media_type two tokens, which would make routing's format_token_for(media_type) ambiguous. Refused at ACTIVATION, naming both drivers and both pairs, rather than resolved by precedence"
