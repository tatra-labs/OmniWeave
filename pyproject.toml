# pyproject.toml — the uv workspace root. NOT publishable.
# Specified in 11-repo-layout.md section 1.1 and charter.md D1 ("The workspace root and the
# zero-dependency foundation"). One repo, one uv workspace, one uv.lock, fourteen members.

[project]
name = "omniweave-monorepo"
version = "0.0.0"
description = "The omniweave workspace root. Holds no code and is never published."
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

# One row per sibling. Without these, uv refuses to resolve a first-party edge that names a
# workspace member (11-repo-layout.md section 2.2: [tool.uv.sources] governs WHERE a member
# resolves from during development and is absent from the published METADATA entirely).
[tool.uv.sources]
omniweave = { workspace = true }
omniweave-conform = { workspace = true }
omniweave-core = { workspace = true }
omniweave-graph = { workspace = true }
omniweave-llm = { workspace = true }
omniweave-office = { workspace = true }
omniweave-pdf = { workspace = true }
omniweave-ports = { workspace = true }
omniweave-serve = { workspace = true }
omniweave-target-deck = { workspace = true }
omniweave-target-docx = { workspace = true }
omniweave-target-pptx = { workspace = true }
omniweave-target-video = { workspace = true }
omniweave-vision = { workspace = true }

# [dependency-groups], the whole of it. Membership is charter.md D1's exactly; the two markers
# are 11-repo-layout.md section 6.2's addition, because semgrep publishes no Windows wheel and
# atheris requires clang, so an unmarked group fails on a third of the nine-cell matrix before
# a test runs. msgpack and zstandard are the REJECTED dependencies, kept dev-only so a
# comparison test can prove the first-party replacement matches them.
[dependency-groups]
dev = [
  "pytest~=9.1",
  "pytest-xdist",
  "ruff",
  "pyright",
  "hypothesis",
  "msgpack",
  "zstandard",
  "tiktoken",
  "semgrep; sys_platform != 'win32'",
  "atheris; sys_platform == 'linux'",
]

# ---------------------------------------------------------------------------
# ruff — one config for all fourteen. 11-repo-layout.md section 8.1, verbatim.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages"]
# `vendor/` is third-party source at a recorded SHA (11-repo-layout.md section 1.7, G12), and its
# bytes ARE the artefact: `vendor/anydoc/anydoc.sha256` digests every one of them so a reviewer can
# fetch the same path from the upstream commit and get a byte match. A formatter or an autofix
# rewriting a line there would break that manifest, fail G12, and change code this repository does
# not own. Excluded from linting for the same reason it is excluded from `packages/` -- it is not
# ours to style.
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM",
          "TID", "PTH", "RUF", "ANN", "S", "PL", "ARG", "RET", "TRY"]
ignore = ["ANN401", "TRY003", "PLR0913"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "S2/S4 only: omniweave_core.toolchain, omniweave_core.host.subproc."
"sqlite3".msg = "INV-17: omniweave_core.store only."
"asyncio".msg = "INV-3: omniweave/run/ only. Core must not import a loop."
"opentelemetry".msg = "omniweave_serve.otlp only."
"random".msg = "Sampling is blake2b. Determinism is a gate, not a habit."

[tool.ruff.lint.per-file-ignores]
"packages/omniweave-core/src/omniweave_core/toolchain.py" = ["TID251"]
"packages/omniweave-core/src/omniweave_core/host/subproc.py" = ["TID251"]
"packages/omniweave-core/src/omniweave_core/store/*.py" = ["TID251"]
"packages/omniweave/src/omniweave/run/*.py" = ["TID251"]

# The Supervisor's own tests read the four semaphore families' bounds, which needs the type they
# are. INV-3's ban is about where a LOOP may live, and a test that asserts `render_sem` is an
# `asyncio.BoundedSemaphore` opened at `max(1, cpus - 2)` is the thing that keeps the invariant
# checkable rather than a breach of it. Scoped to the one file, like the source-side ignore above.
"packages/omniweave/tests/unit/test_run_supervisor.py" = ["TID251"]

# `op.identify`'s three routing columns are nullable-together by CHECK, and the test that proves it
# asserts the database REFUSES the row 03-document-model.md:589 describes. That needs
# `sqlite3.IntegrityError` by name: catching `Exception` would pass on a typo in the SQL, which is
# the one outcome the test exists to rule out. INV-17's ban is about who holds a CONNECTION, and
# these tests get theirs from `omniweave_core.store.sqlite.connect` like everything else.
"packages/omniweave/tests/unit/test_run_expand.py" = ["TID251"]
"packages/omniweave-serve/src/omniweave_serve/otlp.py" = ["TID251"]

# D344, taken. The ban's message generalises INV-3 into a rule about where a loop may LIVE, and
# INV-3 does not say that: charter.md:74 states it about ONE import graph -- "`import
# omniweave_core` is cheap and shallow ... it imports neither `asyncio` nor `selectors`" -- and
# G10, G17 and G23 all measure `omniweave_core` and nothing else. 02-architecture.md:264 row 40
# gives `omniweave-serve` "the `stdio` and `http` transports" by name, and 10-interfaces.md:979
# prints the line they exist to execute (`await transport.send(answer)`), so the two halves are
# not in conflict and never were. G23 does not weaken by one character if `omniweave_serve`
# awaits; it measures a different import. Scoped to the one file that binds real pipes, and inside
# it `asyncio` is named by the two stream adapters and by nothing else (`to_thread`, twice, which a
# test asserts over the AST): the framing, the loop and the ordering take their streams as
# arguments and are tested without a loop at all.
"packages/omniweave-serve/src/omniweave_serve/stdio.py" = ["TID251"]

# The same decision for the other transport 02-architecture.md:264 row 40 names, and a narrower
# use: the ASGI application is driven by whatever server hosts it and starts no loop of its own.
# `asyncio` is named once, for `asyncio.timeout()` in `read_body()`, because 10-interfaces.md:2371
# requires "a `[serve] read_timeout_ms` (default 30,000)" on the body read and the standard library
# has exactly one deadline primitive. A test asserts that single use over the AST.
"packages/omniweave-serve/src/omniweave_serve/http.py" = ["TID251"]

# The one call that runs the loop the two transports are written for: `asyncio.run(serve(...))`
# in `launch.run()`, the `omniweave.serve` entry point `ow serve --mcp` loads. D344's decision a
# third time and the narrowest use of the three: one attribute, `run`, which a test asserts over
# the AST. Everything the loop drives still takes its streams as arguments.
"packages/omniweave-serve/src/omniweave_serve/launch.py" = ["TID251"]

# The transport's tests drive the loop with `asyncio.run` and nothing else. There is no
# pytest-asyncio in the ten-package dev group (02-architecture.md section 3.3 fixes it), so a
# test of an `async def` either starts a loop by name or does not test it. Same escape and same
# scope as `test_run_supervisor.py` above.
"packages/omniweave-serve/tests/unit/test_serve_stdio.py" = ["TID251"]
"packages/omniweave-serve/tests/unit/test_serve_http.py" = ["TID251"]

# `cohort_member`'s foreign key must REFUSE a member whose parent row is absent, and the test
# that asserts it names `sqlite3.IntegrityError`: catching `Exception` would pass on a typo in
# the SQL, which is the one outcome the test exists to rule out. Same escape and same reason as
# `test_store_queue.py`'s inline one, taken at file scope because this file also imports the
# module for a second assertion. Every connection still comes from `omniweave_core.store`.
"packages/omniweave-core/tests/unit/test_store_deps.py" = ["TID251"]

# G32's tests mutate `route_decision_monotone` and assert the gate goes red, which means opening a
# scratch database and naming `sqlite3.IntegrityError`: catching `Exception` would pass on a typo in
# the mutant DDL, which is the one outcome these tests exist to rule out. INV-17's ban is about who
# holds a CONNECTION to a STORE; this file holds one to a file in `tmp_path` that it deletes, and
# `tools/gate_trigger_parity.py` takes the same exemption inline for the same reason.
"packages/omniweave/tests/unit/test_gate_trigger_parity.py" = ["TID251"]

# S106 flags a keyword argument named `token` as a hardcoded password. `Witness.token` is
# 04-driver-system.md:570's own field name -- *"the foreign `(unit_uri, unit_part, token)`
# tuples each item consulted"* -- and the values here are `fig:3` and `tbl:9`. A linter cannot
# tell a driver's label for what it read from a credential; the vocabulary is the plan's.
"packages/omniweave-core/tests/unit/test_deps.py" = ["S106"]

# Same rule family, one module over. Seam S3's `token` is a 32-byte bearer token from a 0600
# sentinel (08-runtime.md:981), which is what closes surya's `VLLM_API_KEY = "EMPTY"` hole --
# so every fixture here has one, and the linter is right that it is a credential and wrong
# that it is hardcoded: the values are `de` and `abcd` and the real one is `os.urandom(32)`.
"packages/omniweave-core/tests/unit/test_modelserver.py" = ["S105", "S106", "S107"]
"packages/omniweave-conform/**" = ["S101"]

# --- P1 additions. Each is a rule whose premise the plan overrides, not a rule being dodged. ---

# RUF001/RUF002 flag "ambiguous" Unicode. In the two grounding modules adversarial Unicode IS the
# subject: `normalize_k`'s operation list is written over U+FB01, U+00DF, U+00AD, U+2010..2015 and
# the zero-width Cf class, and its property tests exercise exactly the characters the rule warns
# about. 06-structure-extraction.md section 1.7 is the specification; a linter cannot tell a
# homoglyph attack from a homoglyph fixture.
"packages/omniweave-core/src/omniweave_core/ident.py" = ["RUF001", "RUF002"]
"packages/omniweave-core/tests/unit/test_ident.py" = ["RUF001", "RUF002"]

# Same rule, same reason, one distribution over. `normalize_eval` exists to fold the quote
# families NFKC leaves alone and the dash table `fold_common` holds (13-quality.md section 8.2),
# so its test corpus IS curly quotes and en dashes. A linter cannot tell a homoglyph fixture
# from a homoglyph attack, and Q-G23 is the property that needs the fixture.
"packages/omniweave-conform/tests/unit/test_conform_kit.py" = ["RUF001", "RUF002"]

# `read_verdict()` is 08-runtime.md section 4.5's six-clause read policy, and the clauses are
# ORDERED: clause 2 precedes clause 4 because an artefact that does not parse cannot be asked
# whether it is empty, and clause 5 precedes clause 6 because a unit mismatch is a bug report and
# must not be reported as a vintage. Six clauses plus the hit is seven returns. Collapsing them to
# satisfy a branch counter would hide the very table the function exists to implement -- the same
# reason `config.py` carries this ignore one line below.
"packages/omniweave-core/src/omniweave_core/cache.py" = ["PLR0911"]

# The coercion table is a ten-arm dispatch over `ConfigKind` (02-architecture.md section 8.4), so
# one return per kind is the shape the plan mandates; collapsing it to satisfy a branch counter
# would hide the very table the module exists to implement. PLC0415: the two cross-module shims
# import lazily on purpose, which is what keeps G17 true.
"packages/omniweave-core/src/omniweave_core/config.py" = ["PLR0911", "PLR0912", "PLR2004", "PLC0415"]

# D400 is a claim about what happens when two OS processes append to one file, and the only way to
# test a claim about two processes is to start two. `subprocess` is banned so that a module reaching
# for it has to argue; the argument here is that 10:1913's guarantee is stated against "an
# interleaved append from a second server process", and a single-process test of it would assert
# the opposite of what the plan says. The `conform` tier exists for exactly this and the file is
# under `tests/conform/` as 13-quality.md section 2.7 requires. PLC0415: the child script is built
# from this process's own `sys.path`, which is a value and not an import.
"packages/omniweave/tests/conform/test_hooks_session_append.py" = ["TID251"]

# D431 is a claim about a child process's stdio encoding when its stdio are pipes, which is how
# every host runs a hook, and nothing in-process can observe it: the parent's streams are whatever
# pytest made them. This suite starts `python -m omniweave hook <event>` exactly as a host would,
# plus one control child running the naive `print()` so the fix is measured against the failure it
# fixes. It is under `tests/conform/` as 13-quality.md section 2.7 requires.
"packages/omniweave/tests/conform/test_hooks_process.py" = ["TID251"]

# 10:2071 requires `DETACHED_PROCESS | CREATE_NO_WINDOW` on Windows and `start_new_session` on
# POSIX, and `posttool.py` spells those as integers because `subprocess` is banned in that package
# for a good reason: a hook that spawned directly would be a second site allowed to, for a call
# `omniweave_core.host.subproc` already knows how to make. This suite imports `subprocess` to
# assert the two spellings are equal, which is the only thing that stops them drifting -- and it
# imports it to READ two constants, never to start a process.
"packages/omniweave/tests/unit/test_hooks_posttool.py" = ["TID251"]

# A test may reach for a private to test it, and a test name may carry a type name verbatim
# (`..._not_a_Path`). Neither is production style.
"packages/omniweave-core/tests/unit/test_config.py" = ["PLC0415", "N802"]

# The purity gate asserts that `open`, `socket` and `subprocess` RAISE under its patched builtins.
# The lambdas defer the call so `pytest.raises` can catch it, and a context manager would defeat
# the assertion outright.
"packages/omniweave-core/tests/test_purity.py" = ["SIM115", "PLW0108"]
"**/tests/**" = ["S101", "PLR2004", "ANN"]

# `fuzz/` is a test tree that is not under a `tests/` directory, because 11-repo-layout.md:390
# puts it at the repository root beside `tools/` and `eval/`. The same three allowances apply for
# the same reasons -- an assertion is what a test is made of, a magic number in an assertion is
# the expected value, and a test's own helpers are not a public API -- and they are spelled out
# here rather than by widening the glob above, so that a file moving out of `fuzz/` loses them.
"fuzz/test_targets.py" = ["S101", "PLR2004", "ANN"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
# The markers are the tier vocabulary of 13-quality.md section 2.7, which Q-G25 enforces by
# directory: a `golden` marker outside tests/golden/ fails (OW-Q-014). --strict-markers is what
# turns a typo in a marker name into an error rather than a silently deselected test, which is
# the failure mode Q-G24 (test inventory) exists to catch after the fact.

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["packages"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "golden: T2 — reads a byte out of fixtures/. Must live in tests/golden/ (Q-G25).",
  "conform: T3 — spawns a subprocess or a Driver host. Must live in tests/conform/ (Q-G25).",
]
