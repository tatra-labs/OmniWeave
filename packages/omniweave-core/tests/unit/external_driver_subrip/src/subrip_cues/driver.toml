# SubRip subtitles: one paragraph Block per cue. An independent driver project (D967).
card_schema = 1

[driver]
id = "parse.subtitle.subrip"
port = "parse/1"
version = "0.1.0"
schema_version = 1
entrypoint = "subrip_cues.driver:SubRipParser"
granularity = "document"
replay_class = "byte_exact"
title = "SubRip subtitles"
summary = "One paragraph Block per subtitle cue, with the byte span of the cue's text lines."

[capability]
formats = ["application/x-subrip"]
consumes = ["raw_bytes"]
produces = ["doc_fragment"]

[capability.parse]
spatial = "none"
origin_span = "exact"
text_span = true
marks = false
reading_order = "source"
sections = "none"
tables = "none"
math = []
assets = "none"
asset_origin = false
notes = "none"
confidence = "none"
furniture = "flagged"
round_trip = "text"
forfeits = []
format_tokens = [
  { media_type = "application/x-subrip", token = "srt" },
]

[hardware]
gpu            = "none"
vram_gb_min    = 0
ram_gb_min     = 0.0625
cpu_arch       = ["x86_64", "aarch64"]
os             = ["linux", "darwin", "windows"]
needs_network  = false
needs_binaries = []
imports_torch  = false
install_bytes  = 16000
services       = []

[isolation]
requires        = "subproc"
memory_mb       = 128
progress_ms     = 15000
wall_ms_hard    = 60000
batch_max_units = 32

[limits]
max_input_bytes = 16777216
max_parts       = 1

[licence.code]
spdx = "MIT"
redistribution = "allowed"
output_share_alike = false
competitor_bar = false
requires_credential = false
revenue_gate_usd = 0
mau_gate = 0
territory_excluded = []
field_of_use_excluded = []
attribution_per_output = false
no_model_training = false
remote_kill_switch = false
clause_refs = []

[deps]
pins = []

[config]
type = "object"
additionalProperties = false
required = []

[cost.model]
class   = "free"
shape   = "linear_per_byte"
unit    = "document"
per_part    = { wall_ms = 1 }
per_session = { }
scaling     = { key = "input_bytes", exponent = 1.0, reference = 65536 }
tokens_out_p95_multiple = 1.0
max_retries = 0
