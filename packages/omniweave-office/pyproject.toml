# packages/omniweave-office/pyproject.toml — a first-party driver distribution.
# 11-repo-layout.md sections 1.2 and 1.5; charter.md D1.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omniweave-office"
version = "0.1.0"                     # == RELEASE. G5.
description = "parse.office.anydoc — DOCX/ODT/RTF/EPUB/CSV/TXT/MD/HTML decode across seam S1."
license = "Apache-2.0"
requires-python = ">=3.11"           # NO upper bound. charter.md D1.
dependencies = [
  "omniweave-ports >=1,<2",
  # NEVER omniweave-core (charter.md section 5 X4, layers.toml rule 3).
  "firecrawl-anydoc == 0.2.4",
  # Exact pin: single-vendor, `pdf-inspector = "1.14.2"` unaudited. MIT source
  # vendored at vendor/anydoc/. Fork trigger: vendor/anydoc/FORK-TRIGGER.md.
]

# THE ENTRY POINT. A DOTTED PACKAGE, no colon and no slash (11-repo-layout.md section 1.5): it
# names the package that holds `driver.toml`, which is what discovery reads WITHOUT IMPORTING. The
# card's own `[driver] entrypoint` is the `module:attr` form and is a different grammar for a
# different job -- `activate()` resolves that one, and only after the card has been read and filtered.
[project.entry-points."omniweave.drivers"]
"parse.office.anydoc" = "omniweave_office"

# THE SECOND GROUP, AND IT IS NOT A SECOND DRIVER. 05-ingest-and-routing.md:2044: a signal provider
# "is **not** a `DriverCard` (no capability floors, never in `resolve()`) and is selected by name,
# exactly like a `VectorBackend`". The provider name is `officexml` and NOT `anydoc`: 05:2046 names
# the four shipped providers and this is one of them, and the distinction is real -- `signals.toml`
# here answers `math.part_frac` by counting `m:oMath` elements in the OOXML, which is this
# package's own XML reading and not the Rust decoder's output.
[project.entry-points."omniweave.signals"]
"officexml" = "omniweave_office"

# The build half, identical in shape in all fourteen. 11-repo-layout.md section 1.3.
[tool.hatch.build.targets.wheel]
packages = ["src/omniweave_office"]

[tool.hatch.build.targets.sdist]
include = ["src", "fixtures", "LICENSE", "NOTICE", "THIRD_PARTY.md", "LICENSES",
           "pyproject.toml"]
# `fixtures/` is in the SDIST and not in the wheel: the conformance run needs them
# (`ow conform --fixtures packages/omniweave-office/fixtures`) and a production install does not.
