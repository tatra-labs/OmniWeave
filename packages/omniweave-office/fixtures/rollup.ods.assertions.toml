# rollup.ods.assertions.toml -- 13-quality.md section 8.1's assertions about rollup.ods.
#
# DRAFTED by Claude on 2026-10-28 (D913, a user ruling of 2026-10-21: Claude drafts, the user
# verifies). Every relation was read off the PARSED document's own `Grid`, not off the outline
# that wrote the bytes. None is checked; an unchecked row runs and never scores (13:1022).
#
# This is the ODF spelling of `summary.xlsx`'s shape -- `table:number-columns-spanned` with its
# covered slots rather than `mergeCell` -- so the two together say the grid is the same whichever
# encoding carried it. `office/has_merges=1` is first on every row, for the reason that file's
# header gives.
schema = "omniweave.assertions/1"

[[assertion]]
id = "t01-branch-opened"
type = "table"
page = 1
cell = "Branch"
right = "Opened"
slices = ["office/has_merges=1"]

[[assertion]]
id = "t02-opened-between"
type = "table"
page = 1
cell = "Opened"
left = "Branch"
right = "Closed"
slices = ["office/has_merges=1"]

[[assertion]]
