checked = "verified"

[[assertion]]
id = "list-order"
type = "order"
page = 1
before = "first item"
after = "second item"
slices = ["office/labelled", "office/docx"]
checked = "verified"

[[assertion]]
id = "q1-revenue"
type = "table"
page = 1
cell = "Q1"
right = "120"
up = "Quarter"
slices = ["office/docx"]
checked = "verified"

[[assertion]]
id = "merged-total"
