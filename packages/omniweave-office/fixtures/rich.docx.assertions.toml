# rich.docx.assertions.toml -- 13-quality.md section 8.1's assertions about rich.docx.
#
# DRAFTED by Claude on 2026-10-21 (D913, a user ruling of 2026-10-21: Claude drafts, the
# user verifies). Each claim was read off fixtures/gen/gen_office_fixtures.py's docx_rich(),
# never off a parse. None is checked: a reviewer who confirms a row against the file adds
