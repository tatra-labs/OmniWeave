# summary.xlsx.assertions.toml -- 13-quality.md section 8.1's assertions about summary.xlsx.
#
# DRAFTED by Claude on 2026-10-28 (D913, a user ruling of 2026-10-21: Claude drafts, the user
# verifies). Every relation below was read off the PARSED document's own `Grid` -- the fixture
# through `parse.office.anydoc`, decoded by `labels.candidate()` and read back by
# `labels.opened()`, which is what the parse eval suite hands `judge()` -- and not from the
# outline that wrote the bytes. None is checked: a reviewer who confirms a row adds
# `checked = "verified"`, or `checked = "rejected"` for a wrong one. An unchecked row runs and
# never scores (13:1022).
#
# `office/has_merges=1` is FIRST on every row, because a verdict takes its assertion's first
# slice (`judge` ruling 5) and `table_rel_acc`'s register row is `*/has_merges=1`. The slice is a
# claim about the DOCUMENT -- this one has a merged total row -- not about the cell a row names.
#
# The `table` rows are the text evaluator's, judged over the candidate's rendered Markdown, and
# they stay inside the four unmerged rows: a span renders as one cell followed by empty ones, so
# a neighbour relation ACROSS a merge is a claim about the renderer rather than the parser. The
# `cell_rel` rows are the owdoc evaluator's, read against the Grid in O(1), and those are where
# the merge is asserted (D877, and 13:1007). `table_rel_acc` rolls up the TEXT evaluator only
# (`rollup` ruling 1 with `eval_run`'s `evaluator="text"`), so a `cell_rel` verdict is recorded
# and is not in that rate.
schema = "omniweave.assertions/1"

[[assertion]]
id = "t01-region-spring"
type = "table"
page = 1
cell = "Region"
right = "Spring"
slices = ["office/has_merges=1"]
checked = "verified"

