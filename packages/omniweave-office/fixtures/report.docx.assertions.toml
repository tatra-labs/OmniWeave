# --- the row-wide merge, on the owdoc evaluator ----------------------------------------------
# One cell covers all three columns, so every cell of the row above answers `down` with it --
# which is `Grid.down` stepping literally one row onto the covering origin (`cells` ruling 2).

[[assertion]]
id = "c01-merged-origin"
type = "cell_rel"
page = 1
cell = "Totalled across every item"
up = "Photographs"
slices = ["office/has_merges=1"]

[[assertion]]
