# packages/omniweave-pdf/pyproject.toml — the shape every third party copies.
# 11-repo-layout.md section 1.5.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omniweave-pdf"
version = "0.1.0"                     # == RELEASE. G5.
description = "parse.pdf.pdfium — text layer, glyph runs, page geometry, rasters."
license = "Apache-2.0"
requires-python = ">=3.11"           # NO upper bound. charter.md D1.
dependencies = [
  # ROLE: THE PORT-MAJOR CEILING, which bounds a type vocabulary and not a release. Section 4.4's
  # support table: "`omniweave-ports >=1,<2` for the life of Port 1 ... a Port 2 is a new
  # distribution version, and Port 1 drivers keep resolving until the framework drops
  # `CONTRACTS_SUPPORTED` support for them". Without `<2` a Port 2 that renames a Protocol
  # resolves silently under a live driver, so section 4.1 rule 3 (11-repo-layout.md:128, :1080)
  # REQUIRES this ceiling rather than permitting it, and `--set` never rewrites it (4.2 row 2).
  "omniweave-ports >=1,<2",
  "pypdfium2>=4.30,!=4.30.1",
  # A specific known-bad release excluded by exact version is more honest than a
  # raised floor, because a floor also forbids the releases below the bad one
  # that were fine (11-repo-layout.md section 1.5).
  "defusedxml>=0.7.1",
]

# THE ENTRY POINT. A DOTTED PACKAGE, no colon and no slash (11-repo-layout.md section 1.5): it
# names the package that holds `driver.toml`, which is what discovery reads. The card's own
# `[driver] entrypoint` is the `module:attr` form and is a different grammar for a different job --
# `activate()` resolves that one, and only after the card has already been read and filtered.
[project.entry-points."omniweave.drivers"]
"parse.pdf.pdfium" = "omniweave_pdf"

# The build half, identical in shape in all fourteen. 11-repo-layout.md section 1.3.
[tool.hatch.build.targets.wheel]
packages = ["src/omniweave_pdf"]

[tool.hatch.build.targets.sdist]
include = ["src", "fixtures", "LICENSE", "NOTICE", "THIRD_PARTY.md", "LICENSES",
           "pyproject.toml"]
# `fixtures/` is in the SDIST and not in the wheel, and the asymmetry is the point: the
# conformance run needs them (`ow conform --fixtures packages/omniweave-pdf/fixtures`) and a
# production install does not. A runtime distribution that shipped its own test corpus would
# be weight `tools/weights.toml` budgets for code.
