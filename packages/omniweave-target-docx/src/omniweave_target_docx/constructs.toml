# constructs.toml — THE IL CONTRACT AS DATA. ONE KEY PER LINE.
# owflow/1, the docx target's IL (09-generation.md section 12.3): block structure, the declared
# inline marks, notes, and a <section> a unit. A FLOW carrier: no row's selector names geometry,
# and the pos.* rows are the forbidden ones that make "this is a flow carrier" checkable.
schema = "omniweave.out-constructs/1"
carrier = "html"
il = "owflow/1"
version = 1
unknown_construct = "forbidden"        # FAIL CLOSED. NOT CONFIGURABLE.
ignore = []
# `code` holds the SYMBOL; the numeric OW-T-nnn is resolved from codes.toml at RENDER time.
# `since` is MANDATORY and MONOTONE.

[[construct]]                          # ── the MANDATORY four, and one normalize
id = "ow.cite"
selector = "@data-ow-cite"
disposition = "native"
round_trip = "exact"
canonical = "cite tokens, one space apart"
maps_to = "lower.cites:provenance_part"
code = "OW_TARGET_CITE_MALFORMED"
since = "0.1.0"

[[construct]]
id = "ow.cite.spacing"
normalizes_to = "ow.cite"
disposition = "normalize"
normalizer = "collapse_space"
round_trip = "normalized"
canonical = "single spaces between cite tokens, none at either end"
code = "OW_TARGET_CITE_SPACING"
severity = "warning"
since = "0.1.0"

[[construct]]
id = "ow.el"
selector = "@data-ow-el"
disposition = "native"
round_trip = "exact"
canonical = "u<NN>/e<N>, minted once, unique per artefact"
maps_to = "lower.ids:bookmark"
code = "OW_TARGET_EL_DUPLICATE"
since = "0.1.0"

[[construct]]
id = "ow.manual"
selector = "html|div[data-ow-manual]"
disposition = "native"
round_trip = "exact"
canonical = "a ManualReason member as the value"
maps_to = "lower.manual:placeholder"
code = "OW_TARGET_MANUAL_REASON_UNKNOWN"
since = "0.1.0"

[[construct]]
id = "ow.unit"
selector = "html|section"
disposition = "native"
round_trip = "exact"
canonical = "the unit root: one <section>, never nested"
maps_to = "lower.units:section"
code = "OW_TARGET_UNIT_MALFORMED"
since = "0.1.0"

