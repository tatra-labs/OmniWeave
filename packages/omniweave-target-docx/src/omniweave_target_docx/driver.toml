# compile.docx.native — the flow target (09-generation.md section 12.3; 16-roadmap.md W9.4).
# "The honest test that the abstraction is not one implementation wearing an interface": a flow
# carrier, no canvas, no z-order, no bake. D781 builds its table, carrier and rules, so
# `ow out check` gates owflow/1; D782 lowers it to WordprocessingML, all but notes and embedded
# citations, and until those land the card says implemented = false and why.
card_schema = 1

[driver]
id = "compile.docx.native"
port = "compile/1"
version = "0.1.0"
schema_version = 1
entrypoint = "omniweave_target_docx.driver:DocxCompiler"
granularity = "document"
replay_class = "byte_exact"
title = "owflow/1 to a .docx (WordprocessingML)"
summary = "A flow document from a closed HTML subset: sections, blocks, lists, tables, notes and frozen pictures, with no geometry anywhere in the IL."

[capability]
consumes = ["il_bundle", "asset"]
produces = ["artifact", "receipt"]

[capability.compile]
determinism = ["part", "byte"]         # `part` is MANDATORY; `byte` is RECORDED and NEVER PROMISED
assets = ["image"]

[compile]
# IDENTITY, LIMITS AND SWITCHES. An unknown key here is a hard error.
target = "docx"
unit = "section"                       # a run of flowed content between section breaks
carrier = "html"
il = "owflow/1"
constructs = "constructs.toml"
constructs_digest = "sha256:cbe2215e820981294a6f50cf1cd19745a207e4143092216977e2eb9a2b472b94"
citations = "embedded"                 # the OOXML provenance part, 09 section 10
provenance_part = "customXml/omniweave-provenance.json"
bake = "unavailable"                   # a flow carrier has no bake tier
measure = "none"                       # line and page breaks are the renderer's
runtime_rules = false
toolchain = ""                         # pure Python: python-docx and lxml
implemented = false
max_units = 64
agent_doc_tokens_max = 3000                # 2,376 cl100k_base tokens at D781: 29 a row
media_type = "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
suffix = ".docx"
reason = "lower() writes every owflow/1 construct but notes and embedded citations, which preflight refuses as unmapped until they are lowered"

[compile.round_trip]
read_back = "parse.docx.native"
project = false                        # no Doc-to-owflow/1 projection is built
fidelity = "patched"                   # an edit in one section can reflow the next one's page break
laws = ["r1", "r2", "r3", "r5", "r6", "r7"]
kind_map = "kind_map.toml"

[hardware]
gpu            = "none"
vram_gb_min    = 0
ram_gb_min     = 0.5
cpu_arch       = ["x86_64", "aarch64"]
os             = ["linux", "darwin", "windows"]
needs_network  = false
needs_binaries = []
imports_torch  = false
install_bytes  = 20000000              # python-docx and lxml, ~20 MB (09 section 12's table)
services       = []

[isolation]
requires        = "subproc"
memory_mb       = 1024
progress_ms     = 15000
wall_ms_hard    = 300000
batch_max_units = 64

[limits]
max_input_bytes = 4194304              # MAX_IL_FILE_BYTES: one IL file at a time
max_parts       = 64                   # [compile] max_units

[licence.code]
spdx = "Apache-2.0"
redistribution = "allowed"
output_share_alike = false
competitor_bar = false
requires_credential = false
revenue_gate_usd = 0
mau_gate = 0
territory_excluded = []
field_of_use_excluded = []
attribution_per_output = false
