# THE DRIVERCARD for `derive.anchor.defterm`. Read WITHOUT importing.
#
# ONE KEY PER LINE -- this file is `tomllib.load`ed and `;` is not a TOML separator. An unknown
# TOP-LEVEL table is a HARD ERROR: a card is a contract, not config.
#
# 04-driver-system.md section 10.1's roster row: `derive/1`, `omniweave-graph`, first_party,
# subproc, free, shipped. 06-structure-extraction.md section 3.5 is the specification and D666 the
# readings; the host reads its input (`owgraph-segment/1`, Segment form, a document's Segments per
# unit -- D668) from the store and writes what it answers through `omniweave_core.store.items`
# (D667).
#
# [cost.measured], [quality] and attestation are ABSENT: they are written by `ow conform` and author
# values are rejected by the publish gate (DR13).
card_schema = 1

[driver]
id = "derive.anchor.defterm"
port = "derive/1"
version = "0.1.0"
schema_version = 1                 # THE ONLY DRIVER VERSION IN A CACHE KEY.
entrypoint = "omniweave_graph.defterm.driver:DefinedTerms"
granularity = "document"           # One document's Segments in, its definition sites out (06:810).
replay_class = "byte_exact"        # Four regexes and a structural rule: no model, clock or network.
title = "Defined terms, abbreviations and glossaries (stdlib)"
summary = "Copular, parenthetical, hereinafter and glossary definitions: a defined_term anchor, its entity and its abbrev/expansion aliases, with cover on the anchor and entity lanes."

[capability]
consumes = []                      # The host's own view over committed Segments (as the
                                   #   segmenter's card says of its document view).
produces = ["graph_items"]

[capability.derive]
items = ["anchor", "entity", "alias"]   # 06:961. The lanes are read off these: anchor, entity.
grounding = "offsets"              # Every anchor carries a span into block.text (D666 ruling 2).
relations = "none"
schema = "none"
confidence = "none"
coreference = false
scripts = ["Latin"]                # The four rules are English contract syntax.
scope_honoured = true              # Every cite it names is one the view handed it.

[derive]
implemented = true
phase = 30                         # 06 section 2.3's row 5: rank 0, phase 30.
max_items_per_segment = 512        # 16 definitions per block, at most four frames each, bounded
                                   #   again by MAX_ITEMS_PER_SEGMENT at the sink.

[hardware]
gpu            = "none"
vram_gb_min    = 0
ram_gb_min     = 0.25
cpu_arch       = ["x86_64", "aarch64"]
os             = ["linux", "darwin", "windows"]
needs_network  = false
needs_binaries = []
imports_torch  = false
install_bytes  = 40000             # This package's Python. No dependency beyond omniweave-ports.
services       = []

[isolation]
requires        = "subproc"
memory_mb       = 512
progress_ms     = 15000
wall_ms_hard    = 120000
batch_max_units = 16

[limits]
max_input_bytes = 134217728        # 128 MiB, the HOST_MAX, as the segmenter's.
max_parts       = 1                # A document is one view.

[licence.code]
spdx = "Apache-2.0"
redistribution = "allowed"
output_share_alike = false
competitor_bar = false
requires_credential = false
revenue_gate_usd = 0
mau_gate = 0
territory_excluded = []
field_of_use_excluded = []
attribution_per_output = false
no_model_training = false
remote_kill_switch = false
clause_refs = []

[deps]
pins = []                          # The standard library and omniweave-ports only.

[config]
type = "object"
additionalProperties = false
required = []

[cost.model]
class   = "free"
shape   = "linear_per_byte"
unit    = "document"
per_part    = { wall_ms = 1 }      # Five pathological 200 KB blocks each run under 30 ms (D666).
per_session = { }
scaling     = { key = "input_bytes", exponent = 1.0, reference = 65536 }
tokens_out_p95_multiple = 1.0
max_retries = 0
