# derive.xref.pattern's reference-shaped tokens. DATA, so a corpus can tune it (06 section 3.4).
#
# One table per pattern: an `akind` (AnchorKind's lower-case member name), a `scope` (the scope the
# DEFINITION side of this kind takes -- informational here: an occurrence is always in one
# document, and resolution reads `anchor.scope`), a Python `re` expression whose FIRST GROUP is the
# resolvable name, and at least three `yes` and three `no` fixtures. `tests/unit/test_xref_rules.py`
# compiles every expression, asserts every `yes` matches whole and every `no` does not match
# anywhere, and asserts no two patterns claim one token over the union of all fixtures -- two
# patterns on one token is a double cover and a duplicate `ref_site`.
#
# 06:1060-1088 prints four patterns; D669 changes them where they fail their own fixtures:
#   * `figure_ref` printed akind `figure` for `Table 4.1` as well, so a table reference could never
#     resolve against a `table` anchor. It is split: `figure_ref` and `table_ref`.
#   * `tab 3 of the binder` is printed as a `no` and the printed expression `[Tt]ab(?:le)?\.?`
#     matches it. `Tab.` now needs its period.
#   * `equation_ref` is added: 06:1031 says the `equation` member's only release-1 producer is this
#     Pass, and the printed set had no pattern for it.
#   * The word-led patterns gain `(?<![A-Za-z])`, so `config 3` is not a figure reference and
#     `suitable 4` not a table one.

[[pattern]]
name = "section_ref"
akind = "section"
scope = "document"
re = '(?:§§?|[Ss]ection|[Cc]lause)\s*([0-9]+(?:\.[0-9]+)*(?:\([a-z]\))?)'
yes = ["§ 4.2(b)", "Section 12", "clause 3.1.4"]
no = ["section of the pipe", "§§ generally", "sectional view"]

[[pattern]]
name = "exhibit_ref"
akind = "exhibit"
scope = "document"
re = '(?<![A-Za-z])(?:[Ee]xhibit|[Ss]chedule|[Aa]ppendix|[Aa]nnex)\s+([A-Z]{1,3}|[0-9]{1,3})\b'
yes = ["Exhibit C", "Schedule 4", "Annex II"]
no = ["exhibit strong growth", "appendix of the report", "annexed hereto"]

[[pattern]]
name = "figure_ref"
akind = "figure"
scope = "document"
re = '(?<![A-Za-z])(?:[Ff]ig(?:ure)?\.?)\s*([0-9]+[a-z]?(?:\.[0-9]+)?)'
yes = ["Fig. 3a", "Figure 12", "fig 4.1"]
no = ["figure it out", "config 3", "figures show growth"]

[[pattern]]
name = "table_ref"
akind = "table"
scope = "document"
re = '(?<![A-Za-z])(?:[Tt]able|[Tt]ab\.)\s*([0-9]+[a-z]?(?:\.[0-9]+)?)'
yes = ["Table 4.1", "Tab. 2", "table 7b"]
no = ["table the motion", "tab 3 of the binder", "suitable 4 ways"]

[[pattern]]
name = "equation_ref"
akind = "equation"
scope = "document"
re = '(?<![A-Za-z])(?:[Ee]quation|[Ee]q\.)\s*\(?([0-9]+[a-z]?(?:\.[0-9]+)?)\)?'
yes = ["Equation 3", "Eq. (12)", "eq. 4.2"]
no = ["equations hold", "equal to 3", "the equation of state"]

[[pattern]]
name = "identifier"
akind = "identifier"
scope = "corpus"
re = '\b([A-Z]{2,5}-[0-9]{2,6})\b'
yes = ["GL-4471", "CVE-2026", "ISO-8601"]
no = ["AND-OR", "PART-1234567", "e-4471"]
