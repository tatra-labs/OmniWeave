# THE DRIVERCARD for `derive.anchor.native`. Read WITHOUT importing.
#
# ONE KEY PER LINE -- this file is `tomllib.load`ed and `;` is not a TOML separator. An unknown
# TOP-LEVEL table is a HARD ERROR: a card is a contract, not config.
#
# 04-driver-system.md section 10.1's roster row: `derive/1`, `omniweave-graph`, first_party,
# subproc, free, shipped. 06-structure-extraction.md section 3.3 is the specification and D670 the
# readings; the host reads its input (`owgraph-segment/1`, Segment form, a document's Segments per
# unit -- D668) from the store and writes what it answers through `omniweave_core.store.items`
# (D667).
#
# [cost.measured], [quality] and attestation are ABSENT: they are written by `ow conform` and author
# values are rejected by the publish gate (DR13).
card_schema = 1

[driver]
id = "derive.anchor.native"
port = "derive/1"
version = "0.1.0"
schema_version = 1                 # THE ONLY DRIVER VERSION IN A CACHE KEY.
entrypoint = "omniweave_graph.native.driver:DeclaredAnchors"
granularity = "document"           # One document's Segments in, its declared anchors out (06:806).
replay_class = "byte_exact"        # Marks and two anchored regexes: no model, clock or network.
title = "Declared anchors: bookmarks, heading numbers, figure, table and schedule labels (stdlib)"
summary = "What a document declares about itself, read off the anchor marks, heading numbering and captions a parse driver stored: one document-scoped anchor each, with cover on the anchor lane."

[capability]
consumes = []                      # The host's own view over committed Segments (as the
                                   #   segmenter's card says of its document view).
produces = ["graph_items"]

[capability.derive]
items = ["anchor"]                 # 06:959. The lane read off it: anchor.
grounding = "offsets"              # Every anchor carries a span into block.text.
relations = "none"
schema = "none"
confidence = "none"
coreference = false
scripts = ["Latin"]                # The label words are English.
scope_honoured = true              # Every cite it names is one the view handed it.

[derive]
implemented = true
phase = 20                         # 06 section 2.3's row 2: rank 0, phase 20.
max_items_per_segment = 512        # A few anchors a block, bounded
                                   #   again by MAX_ITEMS_PER_SEGMENT at the sink.

[hardware]
gpu            = "none"
vram_gb_min    = 0
ram_gb_min     = 0.25
cpu_arch       = ["x86_64", "aarch64"]
os             = ["linux", "darwin", "windows"]
needs_network  = false
needs_binaries = []
imports_torch  = false
install_bytes  = 40000             # This package's Python. No dependency beyond omniweave-ports.
services       = []

[isolation]
requires        = "subproc"
memory_mb       = 512
progress_ms     = 15000
wall_ms_hard    = 120000
batch_max_units = 16

[limits]
max_input_bytes = 134217728        # 128 MiB, the HOST_MAX, as the segmenter's.
max_parts       = 1                # A document is one view.

[licence.code]
spdx = "Apache-2.0"
redistribution = "allowed"
output_share_alike = false
competitor_bar = false
requires_credential = false
revenue_gate_usd = 0
mau_gate = 0
territory_excluded = []
field_of_use_excluded = []
attribution_per_output = false
no_model_training = false
remote_kill_switch = false
clause_refs = []

[deps]
pins = []                          # The standard library and omniweave-ports only.

[config]
type = "object"
additionalProperties = false
required = []

[cost.model]
class   = "free"
shape   = "linear_per_byte"
unit    = "document"
per_part    = { wall_ms = 1 }      # Two anchored regexes per heading (D670).
per_session = { }
scaling     = { key = "input_bytes", exponent = 1.0, reference = 65536 }
tokens_out_p95_multiple = 1.0
max_retries = 0
