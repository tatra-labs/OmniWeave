# compile.text.owtext — the reference compile/1 target (09-generation.md section 12.5;
# 18-api-sketch.md section 6.2). Its job is the contract's REFUSAL branches, in CI, without a
# browser: citations = "sidecar", fidelity = "none", bake = "unavailable", measure = "none".
card_schema = 1

[driver]
id = "compile.text.owtext"
port = "compile/1"
version = "0.1.0"
schema_version = 1
entrypoint = "omniweave_conform.suites.target.owtext.driver:OwTextCompiler"
granularity = "document"
replay_class = "byte_exact"
title = "owtext/1 to plain text (the reference target)"
summary = "Ten constructs over an html carrier, lowered to one text file: the target every refusal branch of compile/1 is exercised against."

[capability]
consumes = ["il_bundle", "asset"]
produces = ["artifact", "receipt"]

[capability.compile]
# SET-VALUED FLOORS ONLY, compared superset-wise.
determinism = ["part", "byte"]         # `part` is MANDATORY; `byte` is RECORDED and NEVER PROMISED
assets = []

[compile]
# IDENTITY, LIMITS AND SWITCHES. An unknown key here is a hard error.
target = "owtext"
unit = "section"
carrier = "html"
il = "owtext/1"
constructs = "constructs.toml"
constructs_digest = "sha256:4a67bf690c1939444b3cb594c2105868e748f2af95ace44f83a96862e7172182"
citations = "sidecar"                  # exercises the "cannot embed" branch
provenance_part = ""
bake = "unavailable"                   # exercises the fail-closed bake refusal
measure = "none"                       # every overflow rule a RECORDED SKIP
runtime_rules = false
toolchain = ""                         # pure Python: no node, no browser
implemented = true
max_units = 64
agent_doc_tokens_max = 1200
media_type = "text/plain"              # the artefact's, the row's NOT NULL media_type
suffix = ".txt"                        # <slug>@<gen>/<slug>.txt

[compile.round_trip]
read_back = "parse.text.owtext"
project = false                        # exercises the "IL was lost, and we say so" refusal
fidelity = "none"
laws = ["r1", "r5", "r6", "r7"]        # r2 and r3 need fidelity != none; r4 needs passthrough
kind_map = "kind_map.toml"

[hardware]
gpu            = "none"
vram_gb_min    = 0
ram_gb_min     = 0.25
cpu_arch       = ["x86_64", "aarch64"]
os             = ["linux", "darwin", "windows"]
needs_network  = false
needs_binaries = []
imports_torch  = false
install_bytes  = 40000
services       = []

[isolation]
requires        = "subproc"
memory_mb       = 512
progress_ms     = 15000
wall_ms_hard    = 120000
batch_max_units = 64

[limits]
max_input_bytes = 4194304              # MAX_IL_FILE_BYTES: one IL file at a time
max_parts       = 64                   # [compile] max_units

[licence.code]
spdx = "Apache-2.0"
redistribution = "allowed"
output_share_alike = false
competitor_bar = false
requires_credential = false
revenue_gate_usd = 0
mau_gate = 0
territory_excluded = []
field_of_use_excluded = []
attribution_per_output = false
