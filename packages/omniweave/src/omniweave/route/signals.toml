[signal."block.area_frac"]
scope = "block"
kind = "measure"
dtype = "float"
domain = [0.0, 1.0]
cost_class = "free"
requires = ["DECODE"]
version = "1.0.0"

[signal."block.sibling_containment"]
scope = "block"
kind = "measure"
dtype = "float"
domain = [0.0, 1.0]
cost_class = "free"
est = { cpu_ms = 1 }
requires = ["DECODE"]
version = "1.0.0"

[signal."block.flagged_frac"]
# SCOPE `part`, NOT `block`, and that is the whole of Open question 3's discharge: 05:2055 says it
# is "registered here, part-scoped, `measure`, FREE, nullable, `req = REPAIR`, so the shipped
# policy passes `ow route lint` check 1 against this table". Its group prefix says `block` and its
# scope says `part` because it MEASURES blocks and is READ per part.
scope = "part"
kind = "measure"
dtype = "float"
domain = [0.0, 1.0]
cost_class = "free"
requires = ["REPAIR"]
version = "1.0.0"

# ═════════════════ verify -- seven keys, all builtin's, all reading a model's output ═══════════

[signal."verify.repeat_ngram_max"]
# olmocr's `repeatdetect.py` streaming n-gram counter. A legal document with a genuinely repeated
# clause trips `>= 12`; `repetition_penalty` stays 1.0 because REAL DOCUMENTS REPEAT, so the guard
# is the detector and its cost when wrong is one extra REGEN attempt bounded by
# `[budget.per_part] calls = 3` (05:2252).
scope = "part"
kind = "count"
dtype = "int"
domain = [0, 2147483647]
cost_class = "free"
est = { cpu_ms = 1 }
requires = ["PAGE"]
version = "1.0.0"

[signal."verify.finish_reason"]
scope = "part"
kind = "fact"
dtype = "str"
domain = ["stop", "length", "content_filter", "error"]
cost_class = "free"
requires = ["PAGE"]
version = "1.0.0"

[signal."verify.token_saturation"]
scope = "part"
kind = "measure"
dtype = "float"
domain = [0.0, 1.0]
cost_class = "free"
requires = ["PAGE"]
version = "1.0.0"

[signal."verify.parse_ok"]
scope = "part"
kind = "fact"
dtype = "bool"
cost_class = "free"
est = { cpu_ms = 1 }
requires = ["PAGE"]
version = "1.0.0"

[signal."verify.nonempty"]
scope = "part"
kind = "fact"
dtype = "bool"
cost_class = "free"
requires = ["PAGE"]
version = "1.0.0"

[signal."verify.attempts_exhausted"]
# The one `verify.*` key that requires REGEN rather than PAGE: it is the attempt counter, and there
# is no attempt to have exhausted until the regeneration ladder has run.
scope = "part"
kind = "fact"
dtype = "bool"
cost_class = "free"
requires = ["REGEN"]
version = "1.0.0"

[signal."verify.grounded_field_frac"]
# `unit`-scoped, because a schema is requested of a document and not of a page.
scope = "unit"
kind = "measure"
dtype = "float"
domain = [0.0, 1.0]
cost_class = "free"
est = { cpu_ms = 4 }
requires = ["PAGE"]
version = "1.0.0"

# ═════════════════ agree -- the free quality channel that may never score accuracy ════════════

[signal."agree.decode_vs_page"]
# THE THIRD registered-and-unread-by-any-rule key, and the only one with two required rungs: when a
# part escalates you have already paid for two independent readings of the same pixels, so the
# normalised edit distance costs nothing and lands exactly on the population where the cheap driver
# is suspect. `TruthKind = "agreement"`, and it may NEVER populate an accuracy column -- two
# readings agreeing is not evidence that either is right (05:2251). W5.7 is the cell that plumbs
# it; this row is its registration.
scope = "part"
kind = "measure"
dtype = "float"
domain = [0.0, 1.0]
cost_class = "free"
est = { cpu_ms = 2 }
requires = ["DECODE", "PAGE"]
version = "1.0.0"

# ═════════════════ doc -- two counters the router already maintains ═══════════════════════════

[signal."doc.escalated_part_frac"]
scope = "doc"
kind = "measure"
dtype = "float"
domain = [0.0, 1.0]
cost_class = "free"
nullable = false
version = "1.0.0"

[signal."doc.rung_run_length"]
# Zero cost: a counter the router already maintains to write `doc.escalated_part_frac`. It exists
# for AMORTISATION, NEVER FOR EVIDENCE SKIPPING -- the charter rejects `signal_sampling
# {head, stride, cap}` permanently, on the measurement that a stride of 32 misses a 40-page
# scanned appendix at pages 2,900-2,940 of a 4,000-page report (05:2250).
scope = "doc"
kind = "count"
dtype = "int"
domain = [0, 2147483647]
cost_class = "free"
nullable = false
version = "1.0.0"

# ═════════════════ driver and budget -- the two keys nothing computes from bytes ══════════════

[signal."driver.unavailable"]
# Written ONCE before evaluation by the compiler's resolution probe, one boolean per reachable
# driver, so `evaluate()` needs no live `resolve()` and RT1 stays enforceable (05:1160). Not
# nullable: the probe covers every driver a reachable rule names, so "we did not ask" cannot occur.
scope = "part"
kind = "fact"
dtype = "bool"
cost_class = "free"
nullable = false
version = "1.0.0"

[signal."budget.exhausted"]
# `provider = "admit"` -- the one row whose provider column names a FUNCTION and not a package
# (05 section 5.1's table). It is "the single channel by which budget reaches routing" (RT9), and
# the whole of INV-14 rests on it being a `put()` into this record rather than a ledger argument:
# a budget change can never alter WHICH rung a document would have taken, only whether it ran.
# Its scope column reads `part / unit`; `part` is written here because that is the grain `admit()`
# reserves at, and a unit-grain exhaustion is the same key at `unit_part = ''`.
provider = "admit"
scope = "part"
kind = "fact"
dtype = "bool"
cost_class = "free"
version = "1.0.0"

