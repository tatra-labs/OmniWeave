# packages/omniweave/pyproject.toml — the CLI distribution.
# 11-repo-layout.md section 1.4. The only distribution that may import
# omniweave_core, omniweave_ports AND omniweave_office.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omniweave"
version = "0.1.0"                     # == RELEASE. G5.
description = "The omniweave CLI, SDK, surface registry, router, Supervisor, planner, host graph passes, install and hooks."
license = "Apache-2.0"
requires-python = ">=3.11"           # NO upper bound. charter.md D1.
dependencies = [
  # ROLE: A FIRST-PARTY SIBLING ON ONE RELEASE TRAIN, which is why this is `~=` and not a floor.
  # `~= 0.1.0` expands to `>= 0.1.0, == 0.1.*` (11-repo-layout.md:610), so it resolves across the
  # MINOR it was built against and no further -- and a MINOR is what moves `SCHEMA`'s deprecation
  # window, `CONTRACT`'s previous-two-releases rule and the store's system-of-record read contract
  # (section 4.4). Written by `tools/check_versions.py --set <RELEASE>` and read back by G5
  # (section 4.2 row 3): do not hand-edit the bound. G7 is why the reason is written down.
  "omniweave-core ~= 0.1.0",
  # ROLE: THE PORT-MAJOR CEILING, which bounds a type vocabulary and not a release. Section 4.4's
  # support table: "`omniweave-ports >=1,<2` for the life of Port 1 ... a Port 2 is a new
  # distribution version, and Port 1 drivers keep resolving until the framework drops
  # `CONTRACTS_SUPPORTED` support for them". Without `<2` a Port 2 that renames a Protocol
  # resolves silently under a live driver, so section 4.1 rule 3 (11-repo-layout.md:128, :1080)
  # REQUIRES this ceiling rather than permitting it, and `--set` never rewrites it (4.2 row 2).
  "omniweave-ports >=1,<2",
  # ROLE: the sibling release train, exactly as for `omniweave-core` above -- `~= 0.1.0` is
  # `>= 0.1.0, == 0.1.*` and `--set` writes it (section 4.2 row 4).
  "omniweave-office ~= 0.1.0",
  # The ONE first-party edge in the whole graph not forced by a protocol. It puts
  # a third-party compiled abi3 wheel on the default install path; charter F33 /
  # OQ-3 is the written question of whether it survives, and the pre-committed
  # exit is to move office behind `omniweave[office]`.
]

# The extras block, complete. A 1:1 ALIAS MAP onto omniweave-* siblings, so
# `pip install omniweave[vision]` and `pip install omniweave-vision` resolve
# identically. There is no [all], no [everything], and no extra may name a
# third-party package (G14). omniweave-conform is deliberately absent: an extra on
# the runtime distribution that pulls pytest is exactly how test-only weight lands
# in a production install. omniweave-target-docx is deliberately not in
# [recommended]. 11-repo-layout.md section 2.2.
#
# GENERATED by tools/check_versions.py --set; asserted by G5. Do not hand-edit a bound.
#
# ROLE FOR ALL THIRTEEN BOUNDS BELOW, which is what G7 asks each of them to carry: the
# sibling release train (section 4.2 row 5). `~= <M>.<m>.0` resolves across one MINOR and no
# further, for the reason spelled out at the `omniweave-core` bound above. The table header
# breaks a comment run, so each line points here from its own line rather than relying on a
# block a reader -- and the gate -- cannot attach to eleven lines at once.
[project.optional-dependencies]
office = ["omniweave-office ~= 0.1.0"]  # ROLE: sibling train (section 4.2)
pdf = ["omniweave-pdf ~= 0.1.0"]  # ROLE: sibling train (section 4.2)
vision = ["omniweave-vision ~= 0.1.0"]  # ROLE: sibling train (section 4.2)
graph = ["omniweave-graph ~= 0.1.0"]  # ROLE: sibling train (section 4.2)
llm = ["omniweave-llm ~= 0.1.0"]  # ROLE: sibling train (section 4.2)
serve = ["omniweave-serve ~= 0.1.0"]  # ROLE: sibling train (section 4.2)
pptx = ["omniweave-target-pptx ~= 0.1.0"]  # ROLE: sibling train (section 4.2)
docx = ["omniweave-target-docx ~= 0.1.0"]  # ROLE: sibling train (section 4.2)
deck = ["omniweave-target-deck ~= 0.1.0"]  # ROLE: sibling train (section 4.2)
video = ["omniweave-target-video ~= 0.1.0"]  # ROLE: sibling train (section 4.2)
recommended = ["omniweave-serve ~= 0.1.0", "omniweave-pdf ~= 0.1.0", "omniweave-target-pptx ~= 0.1.0"]  # ROLE: sibling train (section 4.2)

# The build half, identical in shape in all fourteen. 11-repo-layout.md section 1.3.
[tool.hatch.build.targets.wheel]
packages = ["src/omniweave"]

[tool.hatch.build.targets.sdist]
include = ["src", "LICENSE", "NOTICE", "THIRD_PARTY.md", "LICENSES", "pyproject.toml"]
