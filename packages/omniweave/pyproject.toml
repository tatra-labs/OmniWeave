# packages/omniweave/pyproject.toml — the CLI distribution.
# 11-repo-layout.md section 1.4. The only distribution that may import
# omniweave_core, omniweave_ports AND omniweave_office.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omniweave"
version = "0.1.0"                     # == RELEASE. G5.
description = "The omniweave CLI, SDK, surface registry, router, Supervisor, planner, host graph passes, install and hooks."
license = "Apache-2.0"
requires-python = ">=3.11"           # NO upper bound. charter.md D1.
dependencies = [
  "omniweave-core ~= 0.1.0",
  "omniweave-ports >=1,<2",
  "omniweave-office ~= 0.1.0",
  # The ONE first-party edge in the whole graph not forced by a protocol. It puts
  # a third-party compiled abi3 wheel on the default install path; charter F33 /
  # OQ-3 is the written question of whether it survives, and the pre-committed
  # exit is to move office behind `omniweave[office]`.
]

# The extras block, complete. A 1:1 ALIAS MAP onto omniweave-* siblings, so
# `pip install omniweave[vision]` and `pip install omniweave-vision` resolve
# identically. There is no [all], no [everything], and no extra may name a
# third-party package (G14). omniweave-conform is deliberately absent: an extra on
# the runtime distribution that pulls pytest is exactly how test-only weight lands
# in a production install. omniweave-target-docx is deliberately not in
# [recommended]. 11-repo-layout.md section 2.2.
#
# GENERATED by tools/check_versions.py --set; asserted by G5. Do not hand-edit a bound.
[project.optional-dependencies]
office = ["omniweave-office ~= 0.1.0"]
pdf = ["omniweave-pdf ~= 0.1.0"]
vision = ["omniweave-vision ~= 0.1.0"]
graph = ["omniweave-graph ~= 0.1.0"]
llm = ["omniweave-llm ~= 0.1.0"]
serve = ["omniweave-serve ~= 0.1.0"]
pptx = ["omniweave-target-pptx ~= 0.1.0"]
docx = ["omniweave-target-docx ~= 0.1.0"]
deck = ["omniweave-target-deck ~= 0.1.0"]
video = ["omniweave-target-video ~= 0.1.0"]
recommended = ["omniweave-serve ~= 0.1.0", "omniweave-pdf ~= 0.1.0", "omniweave-target-pptx ~= 0.1.0"]

# The build half, identical in shape in all fourteen. 11-repo-layout.md section 1.3.
[tool.hatch.build.targets.wheel]
packages = ["src/omniweave"]

[tool.hatch.build.targets.sdist]
include = ["src", "LICENSE", "NOTICE", "THIRD_PARTY.md", "LICENSES", "pyproject.toml"]
