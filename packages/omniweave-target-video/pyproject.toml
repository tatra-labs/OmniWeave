# packages/omniweave-target-video/pyproject.toml.
# The card declares `implemented = false` at release 1, so toolchains/video/ ships no
# bundle: the code is reviewable, the target refuses, and section 7.1's asset list has
# one Toolchain bundle rather than two (11-repo-layout.md section 1.6).

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omniweave-target-video"
version = "0.1.0"                     # == RELEASE. G5.
description = "compile.video.native — implemented = false at release 1."
license = "Apache-2.0"
requires-python = ">=3.11"           # NO upper bound. charter.md D1.
dependencies = [
  "omniweave-core ~= 0.1.0",
  "omniweave-ports >=1,<2",
]

# The build half, identical in shape in all fourteen. 11-repo-layout.md section 1.3.
[tool.hatch.build.targets.wheel]
packages = ["src/omniweave_target_video"]

[tool.hatch.build.targets.sdist]
include = ["src", "LICENSE", "NOTICE", "THIRD_PARTY.md", "LICENSES", "pyproject.toml"]
