# constructs.toml — THE IL CONTRACT AS DATA. ONE KEY PER LINE.
# owsvg/1, the pptx target's IL (09-generation.md section 12.1): a closed SVG subset, one <svg>
# root a slide, its viewBox the canvas. The authoring surface is inline attributes and the closed
# set of @style|<prop> rows below, and nothing a cascade would have to resolve.
schema = "omniweave.out-constructs/1"
carrier = "svg"
il = "owsvg/1"
version = 1
unknown_construct = "forbidden"        # FAIL CLOSED. NOT CONFIGURABLE.
ignore = ["svg|desc", "svg|title", "svg|metadata", "@version"]   # version="1.1" says nothing
# `code` holds the SYMBOL; the numeric OW-T-nnn is resolved from codes.toml at RENDER time.
# `since` is MANDATORY and MONOTONE.
# An attribute only a non-exact element holds (a filter primitive's or a marker's) is
# `normalized`, as its host is: `il_digest_rt` elides the host whole, so no mutation of the
# attribute can move it, and R5 asks that every `exact` row's would (D805).

[[construct]]                          # ── the MANDATORY four, and a cite's facts
id = "ow.cite"
selector = "@data-ow-cite"
disposition = "native"
round_trip = "exact"
canonical = "cite tokens, one space apart"
maps_to = "lower.cites:provenance_part"
code = "OW_TARGET_CITE_MALFORMED"
since = "0.1.0"

[[construct]]
id = "ow.cite.spacing"
normalizes_to = "ow.cite"
disposition = "normalize"
normalizer = "collapse_space"
round_trip = "normalized"
canonical = "single spaces between cite tokens, none at either end"
code = "OW_TARGET_CITE_SPACING"
severity = "warning"
since = "0.1.0"

[[construct]]
id = "ow.cite.kind"
selector = "@data-ow-cite-kind"
disposition = "native"
round_trip = "exact"
canonical = "quote | paraphrase | derived | data"
maps_to = "lower.cites:kind"
code = "OW_TARGET_IL_MALFORMED"
since = "0.1.0"

[[construct]]
id = "ow.cite.span"
selector = "@data-ow-cite-span"
disposition = "native"
round_trip = "exact"
canonical = "a:b, a < b, into the cited block's text"
maps_to = "lower.cites:span"
code = "OW_TARGET_IL_MALFORMED"
since = "0.1.0"

[[construct]]
id = "ow.el"
selector = "@data-ow-el"
disposition = "native"
round_trip = "exact"
canonical = "u<NN>/e<N>, minted once, unique per artefact"
maps_to = "lower.ids:shape_name"
code = "OW_TARGET_EL_DUPLICATE"
since = "0.1.0"

[[construct]]
id = "ow.manual"
selector = "svg|g[data-ow-manual]"
disposition = "native"
round_trip = "exact"
