# packages/omniweave-llm/pyproject.toml — the billed derive/1 passes.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omniweave-llm"
version = "0.1.0"                     # == RELEASE. G5.
description = "The four billed_api derive/1 passes, reaching a model through io.service()."
license = "Apache-2.0"
requires-python = ">=3.11"           # NO upper bound. charter.md D1.
dependencies = [
  "omniweave-ports >=1,<2",
  # NO THIRD PARTY: a model is reached through io.service(), not a client library.
]

# The build half, identical in shape in all fourteen. 11-repo-layout.md section 1.3.
[tool.hatch.build.targets.wheel]
packages = ["src/omniweave_llm"]

[tool.hatch.build.targets.sdist]
include = ["src", "LICENSE", "NOTICE", "THIRD_PARTY.md", "LICENSES", "pyproject.toml"]
