trigger     = "The `docx` target cannot reach `GateStatus.passed` without a change to `omniweave_core.out`; **or** `out.constructs_shared_frac`(unbuilt) < 0.15 -- three ConstructTables sharing almost no `maps_to` symbol are three products, not one contract"
mitigation  = "The charter designed the falsifier in: `docx` is in the release-1 set **specifically** to prove the abstraction is not one implementation wearing an interface -- a FLOW carrier, no canvas, no z-order, no bake. `CompileV1` has no `validate()`, so a target cannot skip its own gate (OUT23). `constructs.toml` is data, so per-target divergence is a row count rather than a branch. Determinism, citations, laws and `bake` are all **declared per target** (`deck` omits R4; `video` refuses R3) rather than assumed uniform"
