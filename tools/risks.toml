title       = "**Native context windows grow enough to weaken the value proposition.** The real incumbent is the agent reading the file; if a host can hold a 5,000-page matter and index it internally, four of omniweave's five arguments -- routing, an identity-stable store, a citable graph, a corpus card -- get weaker, and only the fifth, **provenance an answer can be challenged on**, survives untouched"
