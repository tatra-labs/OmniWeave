[[risk]]
id          = "R-O1"
category    = "operational"
source      = "docs/plan/17-risks.md:250"
title       = "**VLM cost blowout.** The measured amplifier is olmocr's: `MAX_TOKENS = 8000` x `--max_page_retries` default **8** = 64,000 output tokens/page (`olmocr/pipeline.py:107,1221`) at $0.20/1M output => **$0.0128/page**, against its own published self-hosted baseline of **< $200 per 1M pages** => $0.0002/page (`olmocr/README.md:36`) -- **a 64x amplification**, with remaining retries fired **in parallel** when the queue is idle (`:343-350`) and `--max_concurrent_requests` defaulting to **1600** (`:1224`). Unlimited-OCR's `MAX_RETRIES = 5` x `REQUEST_TIMEOUT = 1200` (`Unlimited-OCR/infer.py:21-36`) is **100 minutes of a GPU per document**. Retries are the largest attacker-controllable amplifier in the design space"
likelihood  = 4
impact      = 3
owner       = "router"
indicator   = "rebilled_units"
resolves_in = "counter"
trigger     = "`cost.would_have_been_micros_if_uncached` p99 per document > 10 x p50 on any corpus; **or** `rebilled_units` > 0 (an **exact** counter -- +/-1 fails)"
mitigation  = "Five composed mechanisms. (1) The control is a **hard currency budget per document**, not a retry count: `[budget.per_part]` / `[budget.per_unit]` in `.omniweave/policy.d/*.toml`, with the **first exhausted dimension winning**, because a count cannot bound spend when per-attempt cost varies 100x with page density. (2) Reservations are **durable rows** with headroom computed in SQL, so a crash cannot leak headroom and two scheduler processes cannot each admit 2 and show the provider 4. (3) A denial is `DEFERRED_BUDGET`, an `Outcome` rather than a failure, and re-enters the decision as the evidence key `budget.exhausted` (INV-14). (4) INV-13 makes a clean born-digital page cost **zero** `LOCAL_COMPUTE`, render no raster and start no model server, enforced by three **exact** counters. (5) `bytes_egress` defaults to **0**, so the first hosted escalation is deliberate and Grant-gated"
contingency = "The named override is `--allow-cost`; exit code 5 names the approving command. If the p99/p50 ratio stays above 10x after the budget is enforced, the cheap CPU pre-filter becomes mandatory before any metered tier, with its verdict recorded (`skipped: reason`) so it is auditable and appealable -- olmocr's `PdfFilter` exists and its `--apply_filter` is `action=\"store_true\"`, off by default, which is the inherited anti-pattern"
