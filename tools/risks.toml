owner       = "out"
indicator   = ""
trigger     = "Any `artifact` reaching `GateStatus.passed` while its container holds an external relationship target, an `OLEObject`, a `<script>` element, an `xlink:href` to a non-`cas://` scheme, or a remote font reference; **or** the `sandbox` conformance suite lacking an OUT-direction fixture at the P9 exit"
mitigation  = "The substrate exists and points the right way: `AssetLedger.freeze()` is the **only** writer of a compile-time asset and **never fetches** -- a compile that must fetch refuses with `Degradation(kind=\"grant_missing\")` -- so every embedded byte is already frozen, content-addressed and licence-bearing; `zipfile.ZipFile` in write mode is forbidden outside `omniweave_core.out.opc`, so there is exactly one container writer to audit; `portability` already records external asset references as a first-class `Receipt` block"
