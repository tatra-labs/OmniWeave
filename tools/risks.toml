[[risk]]
id          = "R-L7"
category    = "legal"
source      = "docs/plan/17-risks.md:241"
title       = "**The erasure cascade has fourteen locations and only one of them is a table.** [Security](14-security.md) designed the command the earlier drafts of this register said did not exist: `op.redact` behind `ow store redact` replaces a text range with `REDACTION_FILL` (U+2588, repeated to the original **character** length so every stored `TextSpan` stays valid), resolves intersecting `Mark`s, clamps `quote` **down** to `NORMALIZED` and `origin_span` to `none`, deletes the retained `part`, retires intersecting L3 rows through `graph_history`, and reaches `rebind()` rule 2 so the `block_id` **and the cite** are carried. The residual risk is the other thirteen locations -- `block_fts`, assets, the five cache layers, `vseg`, `quarantine`, route digests, retained IL bundles, exports and backups -- and the two-phase `erasure` row (`phase` in `{store_done, complete}`) that makes it resumable across the store/filesystem boundary"
likelihood  = 3
impact      = 3
owner       = "licence"
indicator   = ""
trigger     = "`ow doctor` failing on an `erasure` row not at `complete`; **or** `ow store verify --erased` finding a surviving derivative in any of the fourteen locations"
mitigation  = "The cascade is enumerated rather than discovered, `ow store verify --erased` re-derives it rather than trusting a checklist, `ow doctor` **fails** while any `erasure` row is incomplete, and the operation's dry-run states that it is irreversible. `block_history` with `superseded_by`, `restriction_bits`, and the `part`/`asset` split into CAS are the substrate that makes a redaction survivable at all"
contingency = "Where a derivative cannot be reached -- a backup, an already-exported `.owdoc`, an artefact a customer holds -- the honest answer is corpus re-derivation from a filtered roster, and the erasure summary must say which of the fourteen locations were out of reach rather than reporting a clean result. [Security](14-security.md) open question 5 is the live sub-decision: `vseg` rows are **deleted** because embedding inversion is a published attack, which makes an erasure an index rebuild for the affected segments; if inversion recovers under ~5% of content tokens the row becomes a tombstone plus a `k`-day retention, disclosed in the summary"
