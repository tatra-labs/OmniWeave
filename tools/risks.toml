# The machine-readable risk register. 17-risks.md section 1 is its specification and section 3 is
# its source: "A risk register that lives in a document rots at the speed of the document."
#
# EVERY ROW IS READ OUT OF 17-risks.md SECTION 3's TABLES, not re-authored here. `source` is the
# line each row was read from and `tools/risk_register.py` checks the row against that line rather
# than trusting it -- the same mechanism `tools/invariants.toml` uses for its 151 `[[member]]`
# rows, and for the same reason: sixty rows transcribed by hand would rot.
#
# WHAT THE CHECK IS AND IS NOT. Section 1.1 settles it: the five rules are the `[[job_assertion]]`
# `gates.risk_register`, job `gates`, budget 2 s, and NOT a `G` row. "Repository layout section
# 8.6 spends `G27(d)` on `gate_docs.py` ... That is the correct home for identifier resolution and
# the wrong home for semantic assertions over a register's rows." `Q-G17`'s rot clock deliberately
# does not read this file either, "because the register's rot clock is rule 4 of
# `gates.risk_register`, and one clock per register is the point of not having two homes for one
# key."
#
# ---------------------------------------------------------------------------------------------
# ASCII FOLDING. House style keeps TOML values ASCII and section 3's cells are not. Every value
# carries its cell verbatim under exactly one substitution table, applied nowhere else and
# re-applied by tools/risk_register.py before it compares a row to its `source` line:
#
#     U+2014 EM DASH                 ->  " -- "        U+2026 HORIZONTAL ELLIPSIS   ->  ...
#     U+2192 RIGHTWARDS ARROW        ->  " -> "        U+2248 ALMOST EQUAL TO       ->  ~
#     U+2265 GREATER-THAN OR EQUAL   ->  >=            U+00B1 PLUS-MINUS SIGN       ->  +/-
#     U+2264 LESS-THAN OR EQUAL      ->  <=            U+2212 MINUS SIGN            ->  -
#     U+00D7 MULTIPLICATION SIGN     ->  x             U+03BA GREEK SMALL KAPPA     ->  kappa
#     U+2020 DAGGER                  ->  (unbuilt)     U+2019 RIGHT SINGLE QUOTE    ->  '
#     U+00A7 SECTION SIGN            ->  "section "    U+201C/201D DOUBLE QUOTES    ->  "
#     U+00A0 NO-BREAK SPACE          ->  a space       U+21D2 DOUBLE ARROW         ->  =>
#     U+00B5 MICRO SIGN             ->  u
#
# THE DAGGER IS NOT DECORATION. Section 3 defines it: an id marked with one "does not yet exist
# and is added to `eval/counters.toml` or `eval/perf.toml` by 13-quality.md (metrics) and
# 15-observability.md (event fields) in the same change that merges this document". Eleven rows
# carry one and that change never happened, so the fold spells it `(unbuilt)` rather than dropping
# a character a reader needs.
#
# ---------------------------------------------------------------------------------------------
# RULE 1 AND THE THIRTY-NINE. Rule 1: "Every row's `indicator` resolves to a real instrument -- a
# `[[counter]]` id in `eval/counters.toml`, a `[[budget]]` id in `eval/perf.toml`, a `[[gate]]` id
# in `eval/gates.toml`, a `G<n>` or `Q-G<n>` row or a `[[job_assertion]]` name in
# `tools/gates.toml`, or a `Diag` or `Degradation` code in `codes.toml`. A row whose indicator is
# a sentence is a row nobody will ever notice materialising, and it fails."
#
# Measured over section 3's own sixty rows: TWENTY-ONE resolve. The other thirty-nine name a real,
# leading, specific instrument that is not a row in one of those six registers -- eleven because
# the document itself marks the id unbuilt, and twenty-eight because what they name is a store
# column, a conformance suite, a benchmark harness, a receipt field, a register FIELD rather than
# a row id, a CLI verb's exit, or an observation about the project rather than about a run.
#
# So every row still carries its `trigger` verbatim, and the thirty-nine carry an `[[unmetered]]`
# row naming WHAT the cell names and WHICH kind of instrument it is. Rule 1 is then enforced over
# the twenty-one and ratcheted over the thirty-nine: `tools/risk_register.py` fails if a row
# leaves the declared set without resolving, fails if a declared row resolves and keeps its
# declaration, and fails if the count rises. The alternative -- widening rule 1's six registers
# until the sentence is true -- would be this file rewriting the rule it is supposed to obey.

schema = 1

[register]
horizon           = "v1.0"
review_every_days = 90
owner_roles       = [
  "licence", "model", "drivers", "router", "runtime",
  "retrieval", "out", "surface", "quality", "release",
]
# Section 1's printed row, verbatim, including its dates: `reviewed_at = "2026-09-04"` and
# `review_by = "2026-12-03"`, which is exactly `review_every_days` apart. `owner_roles` is
# byte-diffed against section 1.2's table by rule 4.
source = "docs/plan/17-risks.md:19"


