title       = "**A span is written in one coordinate system and read in another, with no database-level detector.** Also already materialised and also closed: `GraphSink.mention` produced `ts_a`/`ts_b` as offsets from `normalize_k`'s **output** space and stored them as offsets into `block.text`, when every one of `normalize_k`'s operations changes length. `mention`'s DDL constrains `ts_a <= ts_b` and nothing more, SQLite cannot call the normaliser, and **no CHECK, invariant or property test in the plan would have caught it** -- the register's only row whose original detector count was zero. **Closed** by `normalize_k` returning `(normalized, back)` with the back-map built during the transform, `ground()` as the sole producer of any span, a round-trip post-condition asserted inside `ground()` rather than only in fixtures, and P-GROUND's seven fixture classes"
