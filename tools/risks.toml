title       = "**The OUT direction ships active content.** A generated PPTX, HTML or SVG can carry script, external references, embedded objects or outward-pointing OOXML relationships, and **nobody in the mined collection addresses the OUT direction at all**. The inbound half has seven layers; the outbound half has a validator whose specification is a sentence. An artefact compiled from an untrusted corpus and opened by a human in PowerPoint is a delivery vehicle, and it carries omniweave's provenance markers, which makes it more trusted than the source it came from"
