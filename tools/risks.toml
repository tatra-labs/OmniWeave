title       = "**OpenRAIL-M weight licensing on the highest-accuracy parsers.** `marker/MODEL_LICENSE`, `surya/MODEL_LICENSE` and `lift/MODEL_LICENSE` are **byte-identical** (md5 `e1f69b64dee2f1641a9b1ab12adf24d6`). Attachment A **clause 2(c)** bars use \"for any purpose if You ... provide ... any product or service that **competes** with any product or service offered by ... Licensor\" -- **no revenue threshold, no funding threshold, no research carve-out**. Datalab sells document parsing; so does omniweave. The \"$5M startup exemption\" everyone quotes is clauses 2(a)/(b) at `marker/MODEL_LICENSE:56-57`, a *different* clause. `lift/README.md:232` says it outright: \"cannot be used competitively with our API\". The top-level `LICENSE` is Apache-2.0 and mentions weights nowhere: that is the trap"
likelihood  = 5
impact      = 5
owner       = "licence"
indicator   = "G3"
resolves_in = "gate"
trigger     = "`licence.tombstone_hits`(unbuilt) > 0 -- a `resolve()` rejected by a framework tombstone whose `[licence.weights].licence_sha256` matched -- **or** any G3 hit on `marker-pdf`, `surya-ocr`, `texify` or `lift`"
mitigation  = "Three independent mechanisms, none of which is a review habit. (1) `tools/licences.toml` is the build-time denylist over the **resolved graph, the import graph and unpacked artifacts** (G3). (2) Framework-shipped **tombstones** are seeded with these weights' `licence_sha256`, so `compute_tier` returns `forbidden` for any card matching one, and a vetoed id resolves to a **quoted reason and a named replacement** rather than \"unknown driver\" (DR22). (3) `omniweave.acks.toml` voids on a `licence_sha256` change, so a mutated licence fails as `LICENCE_ACK_STALE`. The bit is `Restriction.competitor_bar`, one of the 32 reserved codes, so the fact travels as data. omniweave ships no weights at all"
contingency = "Already taken, and it is a **product** decision recorded once: olmocr weights, Apache-2.0 code **and** weights. The ~4-point olmOCR-bench gap between surya's 83.3% and olmocr's ~79% is **the price of clause 2(c)**, and it is framed to reviewers that way so an accuracy comparison cannot silently reintroduce a licence blocker. The residual risk is reintroduction by a well-meaning benchmark PR, which is precisely what the tombstone seed set catches"
