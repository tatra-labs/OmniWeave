# ---------------------------------------------------------------------------------------------
# ASSERTION 5's SCOPE, AND THE SEVEN PHRASES IT DOES NOT COUNT. ADR-2 decision 2 assertion 5:
# "every spelled-out invariant count in any document equals the number of `[[inv]]` rows whose id
# matches `^INV-\d+$` and whose `force` is `invariant`". The scan is the bare form -- a spelled-out
# number, whitespace, `invariant` or `invariants`, nothing in between -- because a phrase with a
# qualifier in between is counting something else and always was: "five **framework-wide**
# invariants" is INV-21..INV-25, "eighteen **graph** invariants" is the `GR` series.
#
# SCOPE: docs/plan/*.md, docs/plan/adr/*.md and docs/ARCHITECTURE.md. NOT docs/plan/_notes/**,
# which holds the charter, the terminology lock, the panel records and the rulings -- historical
# inputs quoted as written, where a superseded count is the whole point of the sentence. The
# charter's section 2 opens "Twenty properties." and erratum E30 supersedes it; rewriting that
# sentence would destroy the record the erratum points at. plan_lint.py's charter-frozen and
# documents-frozen rules draw the same line for the same reason.
#
# A phrase below is still a real number in a real sentence, so each row says which series it counts
# and `gate_invariants.py` asserts the phrase still occurs in that file -- a stale exemption fails,
# and so does a new unexempted phrase that does not say twenty-five.

[[count_exempt]]
file   = "docs/plan/01-principles.md"
phrase = "two invariants"
why    = """
section 1c is titled "When two invariants collide" and its first sentence repeats the phrase; the \
summary at :8 points at the section. A collision is between two of the twenty-five, not a count \
of them."""

[[count_exempt]]
file   = "docs/plan/07-store-and-retrieval.md"
phrase = "Four invariants"
why    = "the four this document adds to the `ST` series, ST21-ST24, named in the same cell"

[[count_exempt]]
