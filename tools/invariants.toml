# DELIBERATELY ABSENT. An identifier a document cites in order to say it does NOT exist. Both are
# in code spans, so d2's scan finds them, and both would otherwise force a register row for a
# statement nobody has written -- the exact inversion of what this file is for. A row here is the
# visible form of that: the citation, where it is, and the sentence that makes it hypothetical.
# `gate_invariants.py` asserts each `cites` line still contains the identifier, so deleting the
# sentence or minting the identifier for real both force this row to be removed.

[[absent]]
