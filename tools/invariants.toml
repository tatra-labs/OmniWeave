# The invariant register. 01-principles.md section 1e is this file's specification and
# 11-repo-layout.md section "New terms" is its inventory entry; between them they say what it is for:
# "It exists so G27 clause d2 can resolve an invariant identifier a document names, which is
# otherwise unimplementable." Two machines read it, on purpose and for different questions --
# `tools/gate_docs.py` clause d2 asks whether `INV-21` EXISTS, and `tools/gate_invariants.py`, the
# `[[job_assertion]]` `gates.invariant_register`, asks whether its row is WELL-FORMED (ADR-2
# decision 2). Append-only against the previous tag, exactly as `tools/gates.toml` is: a family is
# never dropped and an identifier is never renumbered or reused (11-repo-layout.md:402).
#
# ---------------------------------------------------------------------------------------------
# WHY THERE ARE TWO ROW ARRAYS. 11-repo-layout.md:2695 asks for "one `[[inv]]` row per identifier,
# in the shape 01-principles.md section 1e specifies, carrying its one-line statement, its force,
# its classes and its named enforcers", and section 1e's shape carries `classes` -- a ladder letter
# per enforcer -- and `independent`. Only 01-principles.md states those: each of its twenty-five
# `### INV-<n>` sections opens its `**Enforced by.**` paragraph with the letter, `` `L` -- ``,
# `` `G` -- ``, and the ladder is that document's own artefact. The eight other families are
# assigned by tables that state a one-line invariant and its enforcement and no class at all
# (charter section "Driver invariants DR1-DR24" and its six siblings; 07-store-and-retrieval.md
# section 15 for `ST`; 03-document-model.md for `M-INV`). A class invented here would be invented
# data in the one file whose whole value is that nothing in it is invented.
#
# So: `[[inv]]` carries the twenty-five `INV-<n>` rows in section 1e's full shape, and `[[member]]`
# carries the other 151 identifiers in the shape their own tables state -- id, family, owning
# document, the source line the statement was read from, the statement, and the enforcement cell.
# One row per identifier either way, which is what :2695 asks for in substance; and
# `gates.invariant_register`'s five assertions, every one of which ADR-2 writes in terms of
# `INV-<n>`, run over the array that has the fields they name. 11-repo-layout.md section 8.6's
# "five `[[inv]]` rows" for `M-INV` is honoured on its own terms -- that sentence's point is that
# `M-INV` gets rows "on the same terms" as `DR`, `RT`, `ST`, `I`, `GR`, `OUT` and `SV`, and here it
# does, in the same array as them.
#
# ---------------------------------------------------------------------------------------------
# ASCII FOLDING, and why a row can still be checked against its source. House style keeps TOML
# values ASCII and the source cells are not. Every `[[member]]` value carries its cell verbatim
# under exactly one substitution table, applied nowhere else and re-applied by
# tools/gate_invariants.py before it compares a row to its `source` line:
#
#     U+2014 EM DASH                 ->  " -- "      U+2016 DOUBLE VERTICAL LINE  ->  ||
#     U+21D2 RIGHTWARDS DOUBLE ARROW ->  =>          U+2026 HORIZONTAL ELLIPSIS   ->  ...
#     U+00D7 MULTIPLICATION SIGN     ->  x           U+2208 ELEMENT OF            ->  " in "
#     U+2192 RIGHTWARDS ARROW        ->  ->          U+03A3 GREEK CAPITAL SIGMA   ->  sum
#     U+2227 LOGICAL AND             ->  and         U+00B1 PLUS-MINUS SIGN       ->  +/-
#     U+2264 LESS-THAN OR EQUAL      ->  <=          U+00B7 MIDDLE DOT            ->  .
#     U+2265 GREATER-THAN OR EQUAL   ->  >=          U+2286 SUBSET OF OR EQUAL    ->  subset-of
#     U+00A7 SECTION SIGN            ->  "section "  U+2229 INTERSECTION          ->  intersect
#
# A markdown cell also escapes a pipe as `\|`; a TOML string does not, so the fold unescapes it and
# collapses runs of whitespace. Nothing else is touched, and any other divergence is a failure --
# which is the point of checking at all.
#
# ---------------------------------------------------------------------------------------------
# WHAT `independent` COUNTS, and why it is a floor. ADR-2 decision 3 defines the arithmetic:
# `independent == len(enforcers) + len(sites)`, where `enforcers` holds register ids and `sites`
# holds the enforcers that have no id -- "each entry is either a dotted `omniweave*` symbol, which
# `G27(d)` clause `d1` already resolves by importing it, or a repo-relative path". So `independent`
# is the number of enforcers THIS FILE CAN NAME, and it is at or below the clause count in the
# document's `**Enforced by.**` paragraph: a clause reading "a monkeypatch test" names an enforcer
# with neither an id nor a stable path, and it is not counted. That direction is deliberate. A
# count above the document's claim would be an inflation nobody could check; a count below it
# understates a row and still has to clear ladder rule 1's `>= min_enforcers`, which is the
# assertion that matters.
#
# `classes`, by contrast, is the DISTINCT set of ladder letters the document's paragraph carries, in
# ladder order, which is why INV-1's three clauses (`L`, `L`, `G`) give `["L", "G"]` -- ADR-2
# decision 3 prints that row and this file matches it.
#
# ---------------------------------------------------------------------------------------------
# `[[unbuilt_site]]` IS d1's ESCAPE HATCH, SPELLED FOR SITES. 11-repo-layout.md section 8.6 gives
# clause d1 one escape and makes it narrow: a symbol a document names that does not exist yet must
# be "a declared-and-not-yet-built row in `docs/plan/16-roadmap.md`'s milestone table ... not a
# comment or an allowlist file, so an unbuilt symbol is always also a scheduled one". A `sites`
# entry is a symbol or a path and needs the same escape for the same reason: INV-14's pure
# `evaluate()` lives in `omniweave_core.route.eval`, which P5 builds. Each row below therefore
# carries the phase that builds it, `gate_invariants.py` asserts the phase is one of
# 16-roadmap.md's eleven ids, and the list shrinking is the only way a phase exit can be claimed.
# An unbuilt site still counts toward `independent`: the enforcer is named and scheduled, and
# pretending the row has fewer enforcers than the document claims would hide the gap rather than
# schedule it.

schema = 1

# 01-principles.md section 1 names the ladder and `min_enforcers`; both live here because
# `gates.invariant_register` reads them rather than restating them (ADR-2 decision 2, assertion 2).
ladder = ["A", "S", "L", "G", "X", "R"]
min_enforcers = 2

# ---------------------------------------------------------------------------------------------
# THE NINE FAMILIES. glossary.md's prefix map ("Every numbered identifier a document cites belongs
# to exactly one series, and the owner column names the document that assigns the numbers") is the
# authority for `assigns`; `gate_docs.py` reads these rows rather than hardcoding the prefix set,
# which 11-repo-layout.md:2695 requires in those words.
#
# `pattern` is the scan, and its left boundary rejects both a word character and `-`:
# 11-repo-layout.md section 8.6 is explicit that `INV-3` is a proper substring of `M-INV-3` and the
# two name different statements under different numbering, so a scan without that boundary
# "resolves `M-INV-3` against the framework register, finds a row, and reports a pass for an
# identifier it never looked up". Longest match wins, which is why `M-INV` is listed first.

[[family]]
prefix    = "M-INV"
pattern   = "(?<![\\w-])M-INV-\\d+"
numbers   = "document-model-local invariants"
assigns   = "docs/plan/03-document-model.md"
rows      = "member"
assigned  = 5
# 11-repo-layout.md section 8.6: "Eight families would have left the five model invariants inside a
# gated document with no row and no existence check -- which is the exact drift d2 exists to catch,
# and the projection law is not a place to discover it late."

[[family]]
prefix    = "INV"
pattern   = "(?<![\\w-])INV-\\d+"
numbers   = "framework-wide invariants"
assigns   = "docs/plan/01-principles.md"
rows      = "inv"
assigned  = 25
# glossary.md's map credits the charter and says "extended by 01-principles.md section 1". ADR-2
# decision 1 settles which of the two this register follows: the charter's section 2 opens "Twenty
# properties.", that count is superseded by erratum E30, and INV-21..INV-25 "are invariants; sole
# home 01-principles.md section 1, section 1b, and tools/invariants.toml". So the twenty-five
# `### INV-<n>` sections of 01-principles.md are the assignment, and assertion 1 reads them.

[[family]]
prefix    = "DR"
pattern   = "(?<![\\w-])DR\\d+(?![\\w])"
numbers   = "driver-system invariants"
assigns   = "docs/plan/04-driver-system.md"
rows      = "member"
assigned  = 24
# 04-driver-system.md:2669 states where the text is: "DR1-DR24 are stated in the charter and are
# not restated. What belongs here is the map from invariant to enforcement site." The charter is
# therefore each row's `source` and 04 is its `owner_doc`, which is the same split section 1e makes
# for INV-1 (section in 01-principles.md, `owner_doc = "03-document-model.md"`).

[[family]]
prefix    = "RT"
pattern   = "(?<![\\w-])RT\\d+(?![\\w])"
numbers   = "router invariants"
assigns   = "docs/plan/05-ingest-and-routing.md"
rows      = "member"
assigned  = 14
# The series ends at RT14 and 05-ingest-and-routing.md:3360 says why it is not extended: "Minting
# `RT15`+ would extend the charter's own register, which is a charter amendment on
# 01-principles.md section 1b's five-part path and not something a plan document does alone."
# `RT15` is therefore cited in that document and deliberately has no row -- see `[[absent]]`.

[[family]]
prefix    = "ST"
pattern   = "(?<![\\w-])ST\\d+(?![\\w])"
numbers   = "store invariants"
