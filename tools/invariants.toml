phrase = "nine invariant"
why    = "the same nine families, in the prefix map's own words"

[[count_exempt]]
file   = "docs/plan/README.md"
phrase = "two invariants"
why    = "a pointer to 01-principles.md section 1c, the collision rule"

[[count_exempt]]
file   = "docs/plan/README.md"
phrase = "twenty invariants"
why    = """
a quotation flagging the contradiction: "11-repo-layout.md section 1.8 still describes \
`docs/ARCHITECTURE.md` as carrying 'the twenty invariants'." The sentence exists to say the number \
is wrong."""

[[count_exempt]]
file   = "docs/plan/adr/0002-invariant-and-gate-registers.md"
phrase = "twenty invariants"
why    = """
four quotations of the three claims this ADR supersedes, plus the amendment table's own row \
("'the twenty invariants' becomes twenty-five"). An ADR that could not quote the text it amends \
could not record what it changed."""

