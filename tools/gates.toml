zero at the end of every physical line of every toml fence, naming file, line and fence"""
enabled       = true
added_by      = "ADR-4"
runner        = ["tools/gate_docs.py"]
# Why it cannot be semantic: TOML 1.0.0 permits a newline inside an inline table's braces where it
# falls inside a value, so `tomllib` accepts the charter's D4 block at :2739 and always would have.
# Over the corpus the clause scans 73 fences and reports that one line and no other.

[[gate.clause]]
id             = "a3"
asserts        = """
every toml fence parsing to a table containing a `[[rule]]` array additionally passes \
`ow route lint` checks 1, 2, 4, 5, 7, 9, 10 and 12"""
# Live but interim. `ow route lint` ships at P5, so from P1 the harness runs a standalone check 4
# over `[[rule]]` fences, reading nullability out of 05-ingest-and-routing.md section 5.1's `null`
# column. Pre-committed fallback: at the P5 exit the standalone check is DELETED in the same commit
# that lands a3 -- two implementations of one check is charter section 8 rejection criterion 19.
enabled        = true
added_by       = "ADR-4"
runner         = ["tools/gate_docs.py"]
blocked_until  = "P5 exit for the full form; the standalone check 4 runs from P1"

[[gate.clause]]
id             = "b"
asserts        = """
