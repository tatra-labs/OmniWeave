# ---------------------------------------------------------------------------------------------
# G30 IS AN APPEND THIS FILE MAKES AND SECTION 6.4 DOES NOT YET RENDER.
#
# `tools/gate_tombstones.py` exists, runs, and is a blocking CI check by every criterion section
# 6.8 uses -- and it carries NO `G<n>` anywhere in the plan. 04-driver-system.md section 7.5 states
# the obligation ("CI **fails** a tombstone past its `review_by` date, so the refusal set cannot
# silently ossify"), section 10.4 repeats it over the six cards shipped at release 1, and section
# 7.6's DR22 enforcer column names it only as "the `review_by` CI check". An unnumbered blocking
# check is exactly what V10-1 stopped being able to see when it started quoting this register: if
# the tombstone clock has no row here, "every `G` row in `tools/gates.toml` green" does not cover
# it and no document can cite it.
#
# Why G30 and not a job assertion. Section 8.7 makes a job assertion the cheap path -- "no ADR,
# because it creates no new promise a document can name numerically" -- and it would be the wrong
# path here: DR22 is a numbered promise, 04-driver-system.md section 7.6 already cites this check
# in an enforcer column, and the `[[job_assertion]]` family is spelled "nine at release 1" in four
# places (11-repo-layout.md:2692, glossary.md:719, terminology.md:479, 17-risks.md:265), so a tenth
# would falsify a count this register cannot amend.
#
# Why `status = "registered"` and not `"law"`. Section 8.7's "add a gate" row requires an ADR, then
# a `tools/gate_*.py`, then a row here, then "a row in section 6.4's table". The script and this row
# exist; the ADR and the section 6.4 row do not, and no agent may edit `_plan/`. So the row is
# registered and enforced, and `pending` names what is missing -- ADR-1's `enabled = false` idiom
# would be the wrong instrument, because that says "does not yet fail the build" and this one does.
# The G27 clause-d2 rendering check therefore compares section 6.4's table against the `law` rows
# only, and asserts every non-`law` row carries a `pending` reason.
[[gate]]
id            = "G30"
assertion     = "every framework tombstone's `review_by` is in the future"
jobs          = ["gates"]
# 04-driver-system.md section 4.4 step 5 measures loading the six framework tombstones at ~1.2 ms;
# a date comparison over six files is not measurably more, and 1 s is the smallest budget this
# register already carries (G14).
budget_s      = 1
pr            = true
nightly       = false
release       = true
runner        = ["tools/gate_tombstones.py"]
# 17-risks.md section 1.3: `licence` owns "tombstones" verbatim. A tombstone is a licence reading
# with a date on it (gate_tombstones.py's own header), so the clock and the reading share an owner.
owner         = "licence"
reviewed_at   = "2026-09-07"
review_by     = "2026-12-03"
status        = "registered"
pending       = """
an ADR allocating the number (section 8.7 "add a gate") and a row in section 6.4's table. The \
script and this row exist and block today; the rendering does not."""
section       = "04-driver-system.md section 7.5"

# =============================================================================================
# THE JOB ASSERTIONS. Nine at release 1, in section 6.4's rendering order.
#
# Section 6.4: they "live in `tools/gates.toml` under `[[job_assertion]]` rather than as new G
# numbers. The reason is no longer a quoted count ... but the distinction section 8.7 draws: a
# `G<n>` is a numbered promise a document may cite, and a job assertion is a blocking check that
# belongs to one job and that nothing cites by number. Adding a `G<n>` still requires an ADR on
# that ground alone; adding a job assertion does not. G27 clause d2 resolves a `[[job_assertion]]`
# name the same way it resolves a `G<n>`, so a document may name one without inventing a register."
#
# The name is `<job>.<what>` and the prefix IS the job -- that is not a convention this file
# invented, it is how all nine are spelled in section 6.4's table, and the test asserts it, so a
# row cannot claim `build.` and run in `gates`.
#
# The last two are register checks and are NOT a fifth clause of G27(d): "`d2` resolves whether
# `INV-21` exists, `gates.invariant_register` asserts whether its row is well-formed. Different
# questions, different failure messages, different budgets." 17-risks.md section 1.1 adds
# "It is not `G27(e)`; there is no clause `e`."
# =============================================================================================

