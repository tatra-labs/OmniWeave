# tools/gates.toml -- the G-series register + the [[job_assertion]] rows. Section 6.4.
#
# 11-repo-layout.md section 6.4: "`tools/gates.toml` is the register; this table is its rendering,
# and G27 clause d2 asserts the two agree." This file is the register. It is THE authority on how
# many gates there are: the series is "append-by-ADR and its cardinality lives in the file", because
# ADR-2 retired charter X32's "CI gates are `G1-G27` and nothing else" (erratum E33) and 00-vision
# V10-1:724 now reads "every `G` row in `tools/gates.toml` green ... it holds twenty-nine rows,
# `G1`-`G29`, at release 1". Append-only against the previous tag (section 1.7): a `G<n>` is never
# renumbered and never reused, exactly as an error code is not.
#
# TWENTY-NINE rows are section 6.4's rendering; a THIRTIETH (G30) is registered here and is not yet
# rendered -- see `status` below and the G30 row's own comment.
#
# WHAT BLOCKS WHAT. Twenty-eight of the twenty-nine have a PR job and therefore block a merge.
# G22 does not: it is a nightly 100k-roster scale run with no PR cell, so it blocks the RELEASE
# (section 7.6 checklist step 11, "G22 has no PR cell at all") and is "deliberately absent from
# `ci-ok`'s required set". `pr = false` is the machine-readable form of that, and it is true of
# exactly one row.
#
# ---------------------------------------------------------------------------------------------
# ASCII FOLDING, and why the rendering still matches. House style keeps TOML values ASCII, and
# section 6.4's cells are not. Every value here carries the cell verbatim under exactly one
# substitution table, applied nowhere else:
#
#     U+2194 LEFT RIGHT ARROW           ->  <->      (G5, gates.invariant_register)
#     U+2261 IDENTICAL TO               ->  ==       (G19)
#     U+2014 EM DASH  (an empty cell)   ->  a false boolean, not a string
#     U+00A7 SECTION SIGN               ->  the word "section" in a `section` value
#
# The test that asserts the register against the rendering (G27 clause d2, in
# packages/omniweave-core/tests/unit/test_gates_register.py) folds the markdown side the same way
# before comparing. Any other divergence is a failure, which is the point of the clause.
#
# ---------------------------------------------------------------------------------------------
# CLAUSES ARE NOT ROWS. G27 has lettered clauses (a, a2, a3, b, c, d) and ADR-4 added G27(a2) and
# G27(a3) taking NO new G number ("neither takes a new `G` number", section 6.4). So a clause is a
# `[[gate.clause]]` sub-table of its gate's row, never a row of its own. Three reasons, each
# sufficient:
#   1. a row's identity in this register IS its `G<n>`; a clause has no `G<n>` to be identified by,
#      and giving it one would be the renumbering section 1.7 forbids;
#   2. the enabled/blocked state is PER CLAUSE and not per gate -- ADR-1 decision 6 requires
#      `G27(c)` to sit here with `enabled = false` and a `blocked_by = "ADR-1"` note "so its absence
#      is visible rather than assumed", while a, a2, b and d are live;
#   3. section 8.6 puts clause d0's symbol floor "in `tools/gates.toml` beside G27's row" -- a
#      sub-table is exactly beside it, and a sibling row would not be.
# G23 also gains a clause by ADR-12 consequence 4, but the plan letters it nowhere, so it is
# recorded as a comment on the G23 row rather than invented as `G23(b)`.
#
# ---------------------------------------------------------------------------------------------
# THE RUNNER COLUMNS. Section 6.4's table has no runner column; the glossary's own entry for this
# file says a row carries "its implementing script or job step" (glossary.md:1082, restated at
# 11-repo-layout.md:2693), so the register is where that belongs and section 6.4's table is simply
# not its rendering. Three keys, because a gate is enforced in one of three shapes:
#
#   `runner`          scripts that EXIST on disk today and implement (part of) this row.
#   `runner_planned`  scripts the plan names for this row that are NOT written yet. The test
#                     asserts these do not exist, so landing one forces a register edit rather
#                     than leaving a row pointing at a file nobody wrote.
#   `step`            the workflow step or command, for a row the plan enforces without a
#                     `tools/` script (G13's tag diff, G16's `git worktree` build) and for the
#                     command form of a row that has one (G6, G8).
#
# Every row carries at least one of the three. Runner-to-row is many-to-many by construction:
# `tools/gate_importtime.py` implements G9 and G23 (its own docstring says so, and
# 16-roadmap.md:159 spells the P1 exit line `# G9 + G23`), and `tools/gate_semgrep.py` implements
# G8 and G24 -- which is section 6.4's own reading of G24's budget cell, "(in G8)".
#
# Provenance of every runner name: 16-roadmap.md section 4's phase-exit shell lines, which pair a
# script with its gate in a trailing comment (:158-160, :389-393, :453-458, :513-516, :574-578,
# :743), plus 11-repo-layout.md:1443 (`tools/ci_ok.py`), :1265 (`gate_migrations.py`), section 8.6
# (`gate_docs.py`), 16-roadmap.md:364 (`schemagen.py` for G6) and section 7.6 step 5
# (`gen_notice.py` for G3's fifteen NOTICE trees). Nothing here is guessed from a filename.
#
# ---------------------------------------------------------------------------------------------
# OWNERS ARE AUTHORED, NOT QUOTED. Section 6.8 requires that "every `G<n>` row in
# `tools/gates.toml` carries an owner and a review date, exactly as `eval/gates.toml`'s metric rows
# do", and the plan assigns not one gate to an owner. One rule, applied uniformly and auditable
# against 17-risks.md section 1.3's ten roles: the owner is the role whose "owns" cell names the
# artefact or subsystem the gate's assertion is ABOUT; where no role's cell names it, the owner is
# `release`, which owns "the CI workflows". Four fall out of section 1.3 verbatim -- `licence` owns
# "G3" and "tombstones", `release` owns "`tools/weights.toml`" (G2) and "`CONTRACT`" (G16). The
# consequence is visible and is the honest one: `release` carries sixteen of the thirty `G` rows and
# seven of the nine job assertions, which is exactly the concentration R-A2 predicts and which
# section 1.3 already says must be split before any other role if the ten roles map onto fewer than
# four people. `router` and `retrieval` carry none, because no gate's subject is the policy grammar
# or a Channel.
#
# `reviewed_at` / `review_by` follow the shape 17-risks.md section 1's `[[risk]]` block prints
# (:49-50) and land on the project-wide horizon already in the tree: the six shipped tombstones and
# the risk register's own example row both read `review_by = "2026-12-03"`. One date, one bump.
# Q-G17's rot clock and tools/gate_gate_rot.py (16-roadmap.md:973, "every gate row's `review_by`")
# are what read these.
#
# ---------------------------------------------------------------------------------------------
# WHAT THIS FILE MUST NOT HOLD. `eval/gates.toml` holds the METRIC gates -- `structure_f1`,
# `hallucination_rate`, the Q-G series -- with their own owners, review dates and guards, and
# "neither file may name a row the other owns" (section 1.7). So there is no `Q-G` row here, and
# section 6.4 says why: the static Q-G series' "budgets, owners and review dates live in
# `eval/gates.toml`; this document only reserves them a job." 17-risks.md:56-57 rule 1 lists "a
# `G<n>` or `Q-G<n>` row ... in `tools/gates.toml`" as a resolvable indicator, which contradicts
# both of those; the more specific statements win and a `Q-G<n>` indicator resolves against
# `eval/gates.toml`.

schema = 1

# The nineteen-job graph of section 6.2, by job name. `test` is nine cells
# ({ubuntu, macos, windows} x {3.11, 3.12, 3.13}), which is why section 6.4 renders its two rows
# as "`test` (9)"; every other job is one cell. `ci-ok` is the single required status check and the
# aggregator, so no `[[gate]]` may name it -- a gate running inside `ci-ok` would be a check that
# `ci-ok.skips_declared` had to inspect itself.
#
# `golden` and `parity` carry no `G` row and no job assertion at release 1. They are real jobs
# (section 6.2) and the omission is section 6.4's, not a transcription loss: `golden` carries
# Reductions + Counters + Cassette replay and `parity` the offline/GPU-free/Node-free container
# run, neither of which section 6.4 numbers.
job_name = [
  "versions",
  "gates",
  "test",
  "golden",
  "conform",
  "incremental",
  "crash",
  "parity",
  "toolchains",
  "build",
  "ci-ok",
]

# =============================================================================================
# THE G SERIES. Rows are in section 6.4's rendering order, which puts G5 first because it is CI
# job 1 and every other job needs it. `status = "law"` means the row is rendered in section 6.4's
# table and blocks what its `pr` / `release` cells say; `status = "registered"` means the row is
# enforced but has no section 6.4 rendering yet and therefore carries a `pending` reason.
# =============================================================================================

