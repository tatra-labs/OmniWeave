Two lines of `llms.txt`, and neither is a destination this process ever dials. 10:2441-2442 print `homepage:` and `contact:` as fields of the generated manifest, so the strings are OUTPUT that an agent reads with its own browser or issue tracker -- the same status as the `url` values in `tools/toolchains.toml` above, except that these are compiled in because a generator may not read a file (10:229).

