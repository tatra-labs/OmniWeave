The one name `is_loopback()` accepts that is not an IP literal, and the whole function is a REFUSAL: it decides which bind addresses may open a listener WITHOUT `--api-key` (`OW-A-040`), and which `Host` header a request may carry. Everything it returns `False` for is refused, so this constant narrows the surface rather than widening it -- `0.0.0.0` and `::` are the cases it exists to reject. Nothing here dials anything; the value is compared, never connected to.

The same string is a default in config.py's `serve.allowed_hosts` row above. Two paths because the allowlist and the check that reads it are two sites, and G15 wants each one's reason written where the literal is."""

