[[client]]
module = "asyncio"
path = "packages/omniweave/src/omniweave/run/supervisor.py"
why = """
INV-3's one sanctioned home for a loop — `pyproject.toml`'s `TID251` per-file-ignore is scoped to `packages/omniweave/src/omniweave/run/*.py` and nowhere else, so this path is the invariant's definition site rather than an exception to it.

What is actually imported is `asyncio.BoundedSemaphore`, four times, and nothing else. 08-runtime.md:693-700 prints the constructor: `class_sem`, `worker_sem`, `render_sem` and `service_sem` are the four admission families, and a semaphore opens no descriptor of any kind. This module contains no `open_connection`, no `create_server`, no `loop.sock_*` and no `create_subprocess_*`; it has no loop at all, which is why every function in it is synchronous and testable without one.

The row exists because `asyncio` CAN dial — `asyncio.open_connection` is two attributes away — and clause 1 is a declaration rule rather than a usage analysis (14:779). The day this file gains the loop W4.2 still owes, the loop still opens nothing: the Supervisor's outbound edges are the store thread, the `subproc` DriverHost's own AF_UNIX socket, and the model server's handle, and all three already carry their own rows or their own bans."""

[[client]]
module = "urllib.request"
path = "packages/omniweave-serve/src/omniweave_serve/export.py"
why = """
`ow trace export --otlp <endpoint>`, and it is the ONE outbound HTTP client in the framework. 15-observability.md:2009 bounds when it runs -- OTLP spans leave "**only when invoked**" -- so this is an operator typing a command, never a run, never a request handler and never a background thread. 15:260 says the same from the config side: "`[observe] otlp_endpoint` is honoured by `ow trace export` only; a run never reads it."

**No host is compiled in anywhere.** The URL is `--otlp <endpoint>` or `[observe] otlp_endpoint`, both operator data, and `traces_url()` appends `/v1/traces` to whatever it was given. This module has no default endpoint and no fallback: with neither flag nor key there is nothing to dial.

`urllib.request` rather than a client library for 15:216's reason one layer down -- this distribution's declared dependencies are `core, ports, mcp` under a 40 MB ceiling, and a fifth would have to earn its place against eight lines of stdlib. The dial is ONE call inside `UrllibTransport.post`, which a test asserts over the AST; everything else in the module is pure, takes a `Transport` Protocol, and is tested with a four-line fake that opens nothing.

What crosses is an `ExportTraceServiceRequest` built by `otlp.py` from NDJSON shards. Its resource attributes are a closed list and `Resource.attributes()` REFUSES `host.name`, `host.id`, `os.user`, `process.command_line` and any absolute path (15:259), so the payload names a service, a version, two contract integers and a config digest -- and no machine, no user and no path."""

[[client]]
module = "asyncio"
path = "packages/omniweave-serve/src/omniweave_serve/stdio.py"
why = """
The stdio transport, which 02-architecture.md:264 row 40 gives this distribution by name and which 10-interfaces.md:979 prints the one line of (`await transport.send(answer)`). It is the second half of D344: `pyproject.toml`'s `TID251` per-file-ignore is scoped to this one file and says why there, and this row is the same decision seen from the register that cares whether a machine can be addressed.

**A stdio transport is not a network.** 10:2351 says so where it matters most -- the two ways out of an `ow serve --http` copyleft refusal are removing the driver or serving "over `stdio`, **which is not a network transport**". The peer is the process that launched this one, the channel is the two descriptors it was started with, and there is no address of any kind: no bind, no connect, no hostname, no port. `pipes()` takes `sys.stdin.buffer` and `sys.stdout.buffer` and takes nothing else.

**What is imported is `to_thread`, and only `to_thread`.** Twice, both times wrapping a blocking call on a file object this process already holds -- `stream.readline()` and `stream.write()` plus `stream.flush()`. There is no `open_connection`, no `create_server`, no `loop.sock_*`, no `create_subprocess_*` and no `connect_read_pipe`; a test asserts the last of those over the AST, because it is the one an `asyncio`-native reader would have reached for and the reason it does not is D385 rather than taste.

The row exists because `asyncio` CAN dial -- `asyncio.open_connection` is two attributes away -- and clause 1 is a declaration rule rather than a usage analysis (14:779). The day `ow serve --http` lands it will need its own row at its own path, and it will be making the opposite argument: a listener is exactly what 14:437 and `OW-A-040` exist for.\
"""

[[client]]
module = "asyncio"
path = "packages/omniweave-serve/src/omniweave_serve/http.py"
why = """
The row the `stdio.py` row above said would be needed, and the argument is indeed the opposite one: this module IS the network surface. 02-architecture.md:264 row 40 gives this distribution the `http` transport and 10-interfaces.md section 10 is the whole of what it serves.

**It still opens nothing, and the distinction is the point.** An ASGI application is called; it does not listen. `Listener.__call__` takes `(scope, receive, send)` from whatever server hosts it, and there is no `create_server`, no `bind`, no `listen`, no `open_connection`, no `loop.sock_*` and no socket of any kind in this file. What is imported is `asyncio.timeout`, ONCE, in `read_body()`, because 10-interfaces.md:2371 requires "a `[serve] read_timeout_ms` (default 30,000)" on the body read and the standard library has one deadline primitive. A test asserts that single use over the AST, the same way `stdio.py`'s row is backed.

**The refusals that bound this surface are declared, not assumed.** `guard.listener_refusal()` is `OW-A-040 / OW_HTTP_BIND_UNAUTHENTICATED` -- a non-loopback bind with no `--api-key` does not open at all, and 10:2344 counts `ow serve --http` as one of exactly TWO loopback TCP endpoints the framework sanctions, a third needing a charter amendment. `guard.rebinding_rejection()` is `OW-A-041`, applied before the key comparison. `guard.copyleft_refusal()` is `OW-A-043`, refusing at listener start when an enabled driver's tier carries `copyleft_network` -- which is the same clause 10:2351 says `stdio` does not engage, and `[literal]` rows for `localhost`, `127.0.0.1` and `[::1]` in `config.py` already carry the inbound half of this argument.

**Nothing here serves an inventory.** `/healthz` answers two bytes and `/readyz` a boolean; 10:2325 forbids a release string, a corpus list or a count on either, and `llms.txt` has no route at all because it "enumerates the whole Action surface including unlisted names". A `Rejection` body is one word from a closed vocabulary and never echoes what it rejected.\
"""

