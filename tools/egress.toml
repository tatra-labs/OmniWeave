why = """
The scheme half of the same endpoint. `http` and not `https` because the peer is a process on this machine reached over the loopback interface, where TLS would authenticate a name that resolves to us; what authenticates the peer instead is the 32-byte token in the 0600 sentinel (08-runtime.md:1084, closing surya's `VLLM_API_KEY = "EMPTY"`).

A REFUSAL as much as a destination, like toolchain.py's `https://` row below: `_split()` uses it to reject an endpoint that is not `http://<loopback>:<port>` with no path."""

