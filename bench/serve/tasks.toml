# bench/serve/tasks.toml -- the 30-task catalogue of 13-quality.md section 8.8 (ADR-14 D14.2).
#
# 24 OF 30. Every born-digital task is here. The six scanned tasks are asked of real public-domain
# scans (ADR-14 D14.1 part 3), which a maintainer sources and licence-reviews; they land with the
# scans. test_harness.py's catalogue test stays a strict xfail until all thirty are here.
#
# EVERY ANSWER IS PLANTED. The corpora are generated by fixtures/gen/gen_reference_corpora.py, and
# its PLANTED table writes each answer into one named document. Its ABSENT table names the terms
# no document holds. bench/serve/test_corpora.py holds this file and those tables together.
#
# Grading is casefolded substrings, never a model judge (D600). The agent's system prompt asks for
# NOT FOUND when the documents do not hold the answer, in both arms, so:
#   - a task with an answer `contains` it and `forbids` "not found";
#   - an absence task `contains` "not found";
#   - a damaged task `forbids` the value its Injector made unreadable. The Injectors are P6's
#     absence suite (13 section 8.6); until they exist a damaged task is reported UNMEASURED.
#
# Split (ADR-14 D14.2), born-digital only:
#                  citation  retrieval  absence  damaged
#   legal_matter       2         1         1        1      (+ 6 scanned, owed)
#   data_room          2         4         2        3
#   personal_archive   2         2         2        2

[catalog]
version = 1

# -- legal_matter ------------------------------------------------------------------------------

[[task]]
id = "legal-cite-termination"
class = "citation"
corpus = "legal_matter"
source = "born_digital"
prompt = "What does section 4.2 of the Master Services Agreement say about termination for convenience?"
expect = { contains = ["ninety (90) days"], forbids = ["not found"] }

[[task]]
id = "legal-cite-liability-cap"
class = "citation"
corpus = "legal_matter"
source = "born_digital"
prompt = "Under section 9.1 of the Master Services Agreement, what is each party's liability capped at?"
expect = { contains = ["twelve (12) months"], forbids = ["not found"] }

[[task]]
id = "legal-ret-damages"
class = "retrieval"
corpus = "legal_matter"
source = "born_digital"
prompt = "How much in damages does the plaintiff's complaint seek?"
expect = { contains = ["4,850,000"], forbids = ["not found"] }

[[task]]
id = "legal-abs-singapore"
class = "absence"
corpus = "legal_matter"
source = "born_digital"
prompt = "Which document provides for arbitration seated in Singapore?"
expect = { contains = ["not found"] }

[[task]]
id = "legal-dmg-service-credit"
class = "damaged"
corpus = "legal_matter"
source = "born_digital"
prompt = "What service credit percentage does Amendment No. 1 to the Master Services Agreement set?"
expect = { forbids = ["7.5 percent"] }
injector = "encrypt"

